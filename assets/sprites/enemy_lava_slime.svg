<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="magmaBody" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="80%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </radialGradient>
    <linearGradient id="obsidianCrust" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#44403c"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
  </defs>

  <!-- Bubbling Molten Puddle Base & Dripping Globules -->
  <ellipse cx="32" cy="50" rx="25" ry="7" fill="#7f1d1d" stroke="#290505" stroke-width="1.4"/>
  <circle cx="11" cy="48" r="3" fill="#f97316" stroke="#450a0a" stroke-width="1"/>
  <circle cx="53" cy="49" r="2.5" fill="#fbbf24" stroke="#450a0a" stroke-width="1"/>

  <!-- Main Molten Magma Body -->
  <path d="M 10 48 C 7 32 15 16 32 16 C 49 16 57 32 54 48 C 46 53 18 53 10 48 Z" fill="url(#magmaBody)" stroke="#290505" stroke-width="1.7"/>

  <!-- Floating Cracked Obsidian Crust Plates on Back & Crown -->
  <polygon points="19,19 32,14 45,19 39,24 25,24" fill="url(#obsidianCrust)" stroke="#090d16" stroke-width="1.3"/>
  <polygon points="11,34 18,28 21,37 13,41" fill="url(#obsidianCrust)" stroke="#090d16" stroke-width="1.2"/>
  <polygon points="53,34 46,28 43,37 51,41" fill="url(#obsidianCrust)" stroke="#090d16" stroke-width="1.2"/>

  <!-- White-Hot Incandescent Core & Fierce Slit Eyes -->
  <polygon points="21,29 29,32 28,36 20,34" fill="#ffffff" stroke="#7f1d1d" stroke-width="1"/>
  <polygon points="43,29 35,32 36,36 44,34" fill="#ffffff" stroke="#7f1d1d" stroke-width="1"/>
  <!-- Jagged Molten Maw -->
  <path d="M 22 41 L 26 39 L 30 42 L 34 39 L 38 42 L 42 40 L 40 45 L 24 45 Z" fill="#fef08a" stroke="#7f1d1d" stroke-width="1"/>
</svg>
