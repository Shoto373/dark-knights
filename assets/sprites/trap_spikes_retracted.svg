<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <defs>
    <linearGradient id="ironPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <!-- Floor Plate -->
  <rect x="2" y="2" width="32" height="32" rx="3" fill="url(#ironPlate)" stroke="#090d16" stroke-width="1.5"/>
  <!-- Corner Rivets -->
  <circle cx="5" cy="5" r="1.2" fill="#64748b"/>
  <circle cx="31" cy="5" r="1.2" fill="#64748b"/>
  <circle cx="5" cy="31" r="1.2" fill="#64748b"/>
  <circle cx="31" cy="31" r="1.2" fill="#64748b"/>
  <!-- Inner Recess -->
  <rect x="6" y="6" width="24" height="24" rx="2" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
  <!-- Spike Hole Slits (Retracted Spikes inside darkness) -->
  <rect x="9" y="9" width="6" height="6" rx="1" fill="#020617"/>
  <circle cx="12" cy="12" r="1.5" fill="#475569"/>
  <rect x="21" y="9" width="6" height="6" rx="1" fill="#020617"/>
  <circle cx="24" cy="12" r="1.5" fill="#475569"/>
  <rect x="9" y="21" width="6" height="6" rx="1" fill="#020617"/>
  <circle cx="12" cy="24" r="1.5" fill="#475569"/>
  <rect x="21" y="21" width="6" height="6" rx="1" fill="#020617"/>
  <circle cx="24" cy="24" r="1.5" fill="#475569"/>
  <!-- Grate crosslines -->
  <line x1="6" y1="18" x2="30" y2="18" stroke="#1e293b" stroke-width="1.2"/>
  <line x1="18" y1="6" x2="18" y2="30" stroke="#1e293b" stroke-width="1.2"/>
</svg>