<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Gothic Royal Castle Dark Stone Bed -->
  <rect width="64" height="64" fill="#090a10"/>

  <!-- Tile 1 (Top Left - Polished Obsidian Marble) -->
  <rect x="2" y="2" width="28" height="28" fill="#141824" stroke="#05060a" stroke-width="1.2"/>
  <rect x="5" y="5" width="22" height="22" fill="none" stroke="#252e42" stroke-width="0.8"/>
  <!-- Corner Gothic Diamond Inlay -->
  <polygon points="16,8 24,16 16,24 8,16" fill="#1b2132" stroke="#475569" stroke-width="0.7"/>
  <polygon points="16,12 20,16 16,20 12,16" fill="#0f131c"/>
  <circle cx="16" cy="16" r="1.5" fill="#94a3b8"/>

  <!-- Tile 2 (Top Right - Chiseled Basalt with Gold Inlay) -->
  <rect x="34" y="2" width="28" height="28" fill="#10131d" stroke="#05060a" stroke-width="1.2"/>
  <line x1="35" y1="3" x2="61" y2="3" stroke="#2c364c" stroke-width="1"/>
  <!-- Gothic Fluted Cross -->
  <line x1="48" y1="6" x2="48" y2="26" stroke="#ca8a04" stroke-width="1" opacity="0.75"/>
  <line x1="38" y1="16" x2="58" y2="16" stroke="#ca8a04" stroke-width="1" opacity="0.75"/>
  <circle cx="48" cy="16" r="2" fill="#eab308" opacity="0.85"/>

  <!-- Tile 3 (Bottom Left - Dark Castle Plate with Bone Dust) -->
  <rect x="2" y="34" width="28" height="28" fill="#0f121a" stroke="#05060a" stroke-width="1.2"/>
  <line x1="3" y1="35" x2="29" y2="35" stroke="#222b3d" stroke-width="1"/>
  <!-- Ancient Gothic Engraving -->
  <circle cx="16" cy="48" r="8" fill="none" stroke="#334155" stroke-width="0.8"/>
  <polygon points="16,42 21,52 11,52" fill="none" stroke="#64748b" stroke-width="0.7"/>
  <circle cx="16" cy="47" r="1" fill="#cbd5e1" opacity="0.7"/>

  <!-- Tile 4 (Bottom Right - Polished Dark Marble) -->
  <rect x="34" y="34" width="28" height="28" fill="#151926" stroke="#05060a" stroke-width="1.2"/>
  <rect x="37" y="37" width="22" height="22" fill="none" stroke="#252e42" stroke-width="0.8"/>
  <polygon points="48,40 56,48 48,56 40,48" fill="#1b2132" stroke="#475569" stroke-width="0.7"/>
  <circle cx="48" cy="48" r="1.5" fill="#94a3b8"/>
</svg>

