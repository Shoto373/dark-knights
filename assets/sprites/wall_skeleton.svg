<svg xmlns="http://www.w3.org/2000/svg" width="64" height="32" viewBox="0 0 64 32">
  <!-- Gothic Castle Wall Base -->
  <rect width="64" height="32" fill="#06070a"/>

  <!-- Row 1: Fine-cut Obsidian Blocks with Gothic Insets -->
  <rect x="1" y="1" width="30" height="14" rx="1" fill="#141824" stroke="#06080e" stroke-width="1"/>
  <line x1="2" y1="2" x2="30" y2="2" stroke="#2a3348" stroke-width="0.8"/>
  <path d="M 10 13 L 10 7 Q 16 3 22 7 L 22 13" stroke="#3d4964" stroke-width="0.8" fill="none"/>

  <rect x="33" y="1" width="30" height="14" rx="1" fill="#161b28" stroke="#06080e" stroke-width="1"/>
  <line x1="34" y1="2" x2="62" y2="2" stroke="#2d374d" stroke-width="0.8"/>
  <!-- Gothic Studded Iron Band -->
  <line x1="33" y1="8" x2="63" y2="8" stroke="#0f172a" stroke-width="1.8"/>
  <circle cx="40" cy="8" r="1.2" fill="#94a3b8"/>
  <circle cx="56" cy="8" r="1.2" fill="#94a3b8"/>

  <!-- Row 2: Staggered Masonry with Gold Chiseled Border -->
  <rect x="1" y="17" width="14" height="14" rx="1" fill="#11141f" stroke="#06080e" stroke-width="1"/>
  <line x1="2" y1="18" x2="14" y2="18" stroke="#222a3d" stroke-width="0.8"/>

  <rect x="17" y="17" width="30" height="14" rx="1" fill="#171d2b" stroke="#06080e" stroke-width="1"/>
  <line x1="18" y1="18" x2="46" y2="18" stroke="#2e3850" stroke-width="0.8"/>
  <!-- Gold filigree line in mortar -->
  <line x1="20" y1="24" x2="44" y2="24" stroke="#ca8a04" stroke-width="0.8" opacity="0.6"/>

  <rect x="49" y="17" width="14" height="14" rx="1" fill="#131622" stroke="#06080e" stroke-width="1"/>
  <line x1="50" y1="18" x2="62" y2="18" stroke="#252d40" stroke-width="0.8"/>
</svg>

