  </defs>

  <!-- Shattered Corrupted Golden Halo -->
  <path d="M 18 8 A 15 6 0 1 1 46 8" fill="none" stroke="url(#archonGold)" stroke-width="2.5" stroke-dasharray="9 3"/>

  <!-- 4 Spread Fallen Seraph Wings (Upper & Lower Pair) -->
