<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="infernoFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="85%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#fef9c3"/>
    </linearGradient>
    <linearGradient id="obsArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>

  <!-- Swirling Fire-Vortex Lower Body -->
  <path d="M 18 32 C 12 42 18 52 32 60 C 46 52 52 42 46 32 Z" fill="url(#infernoFlame)" stroke="#450a0a" stroke-width="1.4"/>

  <!-- Roaring Living-Flame Torso -->
  <path d="M 14 20 L 50 20 L 44 40 L 20 40 Z" fill="url(#infernoFlame)" stroke="#450a0a" stroke-width="1.5"/>

  <!-- Obsidian Binding Chest-Harness & Pauldrons -->
  <polygon points="4,18 14,12 21,21 17,30 6,28" fill="url(#obsArmor)" stroke="#f97316" stroke-width="1.3"/>
  <polygon points="60,18 50,12 43,21 47,30 58,28" fill="url(#obsArmor)" stroke="#f97316" stroke-width="1.3"/>
  <path d="M 21 24 L 32 38 L 43 24 L 39 22 L 32 32 L 25 22 Z" fill="url(#obsArmor)" stroke="#fbbf24" stroke-width="1.1"/>
  <circle cx="32" cy="32" r="3.5" fill="#ffffff"/>

  <!-- Blazing Plasma Arms with Obsidian Bracers -->
  <path d="M 6 28 L 15 28 L 13 43 L 4 41 Z" fill="url(#infernoFlame)" stroke="#450a0a" stroke-width="1.2"/>
  <rect x="5" y="34" width="9" height="5" rx="1" fill="url(#obsArmor)" stroke="#fbbf24" stroke-width="1"/>
  <path d="M 58 28 L 49 28 L 51 43 L 60 41 Z" fill="url(#infernoFlame)" stroke="#450a0a" stroke-width="1.2"/>
  <rect x="50" y="34" width="9" height="5" rx="1" fill="url(#obsArmor)" stroke="#fbbf24" stroke-width="1"/>

  <!-- Crowned Flame-Head -->
  <path d="M 19 22 C 17 12 22 4 25 2 C 28 8 30 6 32 0 C 34 6 36 8 39 2 C 42 4 47 12 45 22 Z" fill="url(#infernoFlame)" stroke="#450a0a" stroke-width="1.5"/>
  <!-- Obsidian Brow Crown -->
  <polygon points="20,14 32,18 44,14 41,10 32,13 23,10" fill="url(#obsArmor)" stroke="#fbbf24" stroke-width="1"/>
  <!-- White-Hot Eyes -->
  <polygon points="23,16 29,18 28,21 23,19" fill="#ffffff"/>
  <polygon points="41,16 35,18 36,21 41,19" fill="#ffffff"/>
</svg>
