<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Skeleton Castle Royal Heraldic Crest -->
  <defs>
    <radialGradient id="skelCrestAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="48" cy="48" r="44" fill="url(#skelCrestAura)"/>
  
  <!-- Outer Gold filigree ring -->
  <circle cx="48" cy="48" r="40" fill="none" stroke="#ca8a04" stroke-width="2.5"/>
  <circle cx="48" cy="48" r="34" fill="none" stroke="#475569" stroke-width="1.2"/>
  <circle cx="48" cy="48" r="30" fill="none" stroke="#ca8a04" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- Twin Crossed Broadswords Behind Shield -->
  <line x1="16" y1="16" x2="80" y2="80" stroke="#94a3b8" stroke-width="3"/>
  <line x1="80" y1="16" x2="16" y2="80" stroke="#94a3b8" stroke-width="3"/>
  <rect x="22" y="24" width="8" height="3" fill="#eab308" transform="rotate(-45 26 25.5)"/>
  <rect x="66" y="24" width="8" height="3" fill="#eab308" transform="rotate(45 70 25.5)"/>

  <!-- Gothic Heater Shield Body -->
  <path d="M 30 28 L 66 28 L 66 52 Q 48 76 48 76 Q 30 52 30 52 Z" fill="#0f172a" stroke="#ca8a04" stroke-width="2"/>
  
  <!-- Crown on Shield -->
  <polygon points="38,24 42,16 48,22 54,16 58,24" fill="#eab308" stroke="#713f12" stroke-width="1"/>
  <circle cx="48" cy="18" r="1.5" fill="#ef4444"/>

  <!-- Winged Skull on Shield -->
  <ellipse cx="48" cy="44" rx="9" ry="8" fill="#e2e8f0" stroke="#090d16" stroke-width="1.2"/>
  <circle cx="45" cy="43" r="1.8" fill="#090d16"/>
  <circle cx="51" cy="43" r="1.8" fill="#090d16"/>
  <circle cx="45" cy="43" r="0.8" fill="#38bdf8"/>
  <circle cx="51" cy="43" r="0.8" fill="#38bdf8"/>
  <!-- Teeth -->
  <line x1="46" y1="50" x2="46" y2="52" stroke="#090d16" stroke-width="1"/>
  <line x1="48" y1="50" x2="48" y2="52" stroke="#090d16" stroke-width="1"/>
  <line x1="50" y1="50" x2="50" y2="52" stroke="#090d16" stroke-width="1"/>
</svg>

