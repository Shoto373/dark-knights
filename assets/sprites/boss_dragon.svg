  <polygon points="15,60 12,68 18,63 20,69 25,61" fill="#fef08a" stroke="#290505" stroke-width="1.2"/>
  <path d="M 78 42 L 68 40 L 70 62 L 80 60 Z" fill="url(#drakeScale)" stroke="#290505" stroke-width="2"/>
  <polygon points="81,60 84,68 78,63 76,69 71,61" fill="#fef08a" stroke="#290505" stroke-width="1.2"/>

  <!-- Swept-Back Obsidian Dragon Horns -->
