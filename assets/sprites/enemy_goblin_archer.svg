<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="archSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="70%" stop-color="#4d7c0f"/>
      <stop offset="100%" stop-color="#1a2e05"/>
    </linearGradient>
    <linearGradient id="archHood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#365314"/>
      <stop offset="65%" stop-color="#1a2e05"/>
      <stop offset="100%" stop-color="#0a1402"/>
    </linearGradient>
    <linearGradient id="archLeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>

  <!-- Quiver with Red-Fletched Arrows on Back -->
  <g transform="rotate(16 44 18)">
    <rect x="40" y="8" width="8" height="20" rx="2" fill="url(#archLeather)" stroke="#090d16" stroke-width="1.3"/>
    <polygon points="41,3 43,9 39,9" fill="#ef4444" stroke="#090d16" stroke-width="0.7"/>
    <polygon points="46,2 48,8 44,8" fill="#ef4444" stroke="#090d16" stroke-width="0.7"/>
  </g>

  <!-- Forest Camo Cloak -->
  <path d="M 19 25 L 14 50 L 24 46 L 32 51 L 40 46 L 50 50 L 45 25 Z" fill="url(#archHood)" stroke="#090d16" stroke-width="1.4"/>

  <!-- Agile Leather Jerkin -->
  <path d="M 21 26 L 43 26 L 40 45 L 24 45 Z" fill="url(#archLeather)" stroke="#090d16" stroke-width="1.5"/>
  <path d="M 24 27 L 40 27 L 36 37 L 28 37 Z" fill="#365314" stroke="#090d16" stroke-width="1"/>
  <!-- Archer Chest Guard Strap -->
  <line x1="22" y1="27" x2="40" y2="43" stroke="#d97706" stroke-width="2"/>
  <rect x="22" y="42" width="20" height="4" rx="1" fill="#291103" stroke="#090d16" stroke-width="1"/>
  <rect x="30" y="41.5" width="4" height="5" rx="1" fill="#eab308" stroke="#090d16" stroke-width="0.8"/>

  <!-- Arms with Archer Bracers -->
  <path d="M 14 27 L 21 26 L 20 40 L 14 40 Z" fill="url(#archSkin)" stroke="#090d16" stroke-width="1.3"/>
  <rect x="13" y="33" width="7" height="6" rx="1.5" fill="url(#archLeather)" stroke="#090d16" stroke-width="1.1"/>
  <path d="M 43 26 L 50 27 L 50 40 L 44 40 Z" fill="url(#archSkin)" stroke="#090d16" stroke-width="1.3"/>
  <rect x="44" y="33" width="7" height="6" rx="1.5" fill="url(#archLeather)" stroke="#090d16" stroke-width="1.1"/>

  <!-- Pointed Goblin Ears Poking Through Hood -->
  <polygon points="19,17 4,12 9,22 19,23" fill="url(#archSkin)" stroke="#090d16" stroke-width="1.4"/>
  <polygon points="45,17 60,12 55,22 45,23" fill="url(#archSkin)" stroke="#090d16" stroke-width="1.4"/>

  <!-- Head & Deep Stalker Hood -->
  <path d="M 19 14 C 19 6 45 6 45 14 L 43 27 C 37 30 27 30 21 27 Z" fill="url(#archSkin)" stroke="#090d16" stroke-width="1.5"/>
  <path d="M 17 17 C 17 3 47 3 47 17 L 44 13 L 32 18 L 20 13 Z" fill="url(#archHood)" stroke="#090d16" stroke-width="1.5"/>
  <polygon points="32,2 36,8 28,8" fill="url(#archHood)" stroke="#090d16" stroke-width="1.2"/>

  <!-- Glowing Yellow-Red Predator Eyes -->
  <polygon points="22,17 30,19 29,22 22,21" fill="#facc15" stroke="#090d16" stroke-width="0.9"/>
  <polygon points="42,17 34,19 35,22 42,21" fill="#facc15" stroke="#090d16" stroke-width="0.9"/>
  <circle cx="26" cy="19.5" r="1" fill="#dc2626"/>
  <circle cx="38" cy="19.5" r="1" fill="#dc2626"/>

  <!-- Bandana Mask over Lower Face -->
  <path d="M 21 22 L 43 22 L 40 29 L 32 31 L 24 29 Z" fill="#7f1d1d" stroke="#090d16" stroke-width="1.2"/>
</svg>
