<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="execArmor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#52525b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="bloodCrimson" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="65%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#2b0505"/>
    </linearGradient>
  </defs>

  <!-- Crimson Inquisitor Mantle & Tabard -->
  <path d="M 16 22 L 12 52 L 24 49 L 32 54 L 40 49 L 52 52 L 48 22 Z" fill="url(#bloodCrimson)" stroke="#090d16" stroke-width="1.5"/>

  <!-- Heavy Blood-Forged Plate Cuirass -->
  <path d="M 14 21 L 50 21 L 45 47 L 19 47 Z" fill="url(#execArmor)" stroke="#090d16" stroke-width="1.8"/>
  <!-- Ribbed Gothic Chest Ridges & Crimson Skull Sigil -->
  <line x1="22" y1="24" x2="25" y2="42" stroke="#f43f5e" stroke-width="1.5"/>
  <line x1="42" y1="24" x2="39" y2="42" stroke="#f43f5e" stroke-width="1.5"/>
  <polygon points="32,26 37,33 32,40 27,33" fill="#be123c" stroke="#fda4af" stroke-width="1"/>

  <!-- Massive Spiked Pauldrons -->
  <polygon points="3,21 15,17 19,29 5,30" fill="url(#execArmor)" stroke="#090d16" stroke-width="1.6"/>
  <polygon points="6,19 2,10 12,17" fill="#fda4af" stroke="#090d16" stroke-width="1.1"/>
  <polygon points="61,21 49,17 45,29 59,30" fill="url(#execArmor)" stroke="#090d16" stroke-width="1.6"/>
  <polygon points="58,19 62,10 52,17" fill="#fda4af" stroke="#090d16" stroke-width="1.1"/>

  <!-- Chained Forearm Gauntlets -->
  <rect x="6" y="29" width="10" height="15" rx="2.5" fill="url(#execArmor)" stroke="#090d16" stroke-width="1.5"/>
  <rect x="48" y="29" width="10" height="15" rx="2.5" fill="url(#execArmor)" stroke="#090d16" stroke-width="1.5"/>

  <!-- Pointed Executioner Hood & Iron Faceplate -->
  <path d="M 18 23 L 22 7 L 32 1 L 42 7 L 46 23 Z" fill="#18181b" stroke="#090d16" stroke-width="1.7"/>
  <path d="M 22 14 L 42 14 L 40 23 L 24 23 Z" fill="url(#execArmor)" stroke="#090d16" stroke-width="1.3"/>
  <!-- Blazing Crimson Executioner Eyes -->
  <polygon points="24,15 30,17 29,19 24,18" fill="#fb7185"/>
  <polygon points="40,15 34,17 35,19 40,18" fill="#fb7185"/>
</svg>
