<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chimeraBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="60%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="venomGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <!-- Twin Barbed Scorpion-Shadow Tails Arching Over Back -->
  <path d="M 20 36 C 6 26 6 10 18 6 C 14 14 14 22 24 30 Z" fill="#2e1065" stroke="#a855f7" stroke-width="1.2"/>
  <polygon points="18,6 24,3 21,10" fill="url(#venomGlow)" stroke="#090d16" stroke-width="1"/>
  <path d="M 44 36 C 58 26 58 10 46 6 C 50 14 50 22 40 30 Z" fill="#2e1065" stroke="#a855f7" stroke-width="1.2"/>
  <polygon points="46,6 40,3 43,10" fill="url(#venomGlow)" stroke="#090d16" stroke-width="1"/>

  <!-- Muscular Abyssal Beast Torso & Shadow Mane -->
  <path d="M 12 24 L 52 24 L 46 48 L 18 48 Z" fill="url(#chimeraBody)" stroke="#090d16" stroke-width="1.7"/>
  <!-- Jagged Shadow-Fur Mane -->
  <polygon points="10,22 18,12 24,20 32,10 40,20 46,12 54,22 48,30 16,30" fill="#1e0536" stroke="#7e22ce" stroke-width="1.3"/>

  <!-- Razor-Clawed Forelimbs -->
  <path d="M 6 32 L 16 30 L 18 47 L 8 47 Z" fill="url(#chimeraBody)" stroke="#090d16" stroke-width="1.5"/>
  <polygon points="7,47 5,53 10,49 12,53 15,47" fill="url(#venomGlow)" stroke="#090d16" stroke-width="0.9"/>
  <path d="M 58 32 L 48 30 L 46 47 L 56 47 Z" fill="url(#chimeraBody)" stroke="#090d16" stroke-width="1.5"/>
  <polygon points="57,47 59,53 54,49 52,53 49,47" fill="url(#venomGlow)" stroke="#090d16" stroke-width="0.9"/>

  <!-- Ferocious Chimera Head with 4 Glowing Venom-Green Eyes -->
  <path d="M 18 16 C 18 8 46 8 46 16 L 43 32 L 32 36 L 21 32 Z" fill="url(#chimeraBody)" stroke="#090d16" stroke-width="1.7"/>
  <!-- Upper & Lower Pair of Eyes -->
  <polygon points="21,18 28,20 27,22 21,21" fill="url(#venomGlow)"/>
  <polygon points="43,18 36,20 37,22 43,21" fill="url(#venomGlow)"/>
  <polygon points="22,23 30,25 29,28 22,26" fill="url(#venomGlow)"/>
  <polygon points="42,23 34,25 35,28 42,26" fill="url(#venomGlow)"/>

  <!-- Venom-Dripping Fangs -->
  <polygon points="25,30 27,37 30,31" fill="#ecfccb" stroke="#090d16" stroke-width="1"/>
  <polygon points="39,30 37,37 34,31" fill="#ecfccb" stroke="#090d16" stroke-width="1"/>
</svg>
