  <line x1="20" y1="13" x2="20" y2="38" stroke="url(#metalGrad)" stroke-width="1.2"/>
  <!-- Metal Flask Neck & Rim -->
  <rect x="16" y="6" width="8" height="5" rx="1" fill="url(#metalGrad)" stroke="#1c1917" stroke-width="1"/>
  <ellipse cx="20" cy="5" rx="5" ry="2" fill="url(#metalGrad)" stroke="#1c1917" stroke-width="1"/>
  <!-- Stopper / Gem -->
  <circle cx="20" cy="3" r="2.2" fill="#ef4444" stroke="#7f1d1d" stroke-width="0.8"/>
  <circle cx="19" cy="2" r="0.8" fill="#ffffff"/>
