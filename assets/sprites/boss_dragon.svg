      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="55%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="drakeWingMembrane" x1="0%" y1="0%" x2="100%" y2="100%">
