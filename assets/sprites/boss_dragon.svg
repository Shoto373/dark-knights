  <polygon points="34,21 44,24 43,28 34,26" fill="#fef08a" stroke="#450a0a" stroke-width="1.2"/>
  <polygon points="62,21 52,24 53,28 62,26" fill="#fef08a" stroke="#450a0a" stroke-width="1.2"/>
  <!-- Glowing Hellfire Slit in Jaws -->
