      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="35%" stop-color="#a855f7"/>
      <stop offset="75%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#090414" stop-opacity="0.1"/>
    </radialGradient>
    <linearGradient id="voidShroud" x1="0%" y1="0%" x2="0%" y2="100%">
