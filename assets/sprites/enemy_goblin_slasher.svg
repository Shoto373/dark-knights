<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gobSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#65a30d"/>
      <stop offset="65%" stop-color="#3f6212"/>
      <stop offset="100%" stop-color="#1a2e05"/>
    </linearGradient>
    <linearGradient id="gobLeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="60%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c0a00"/>
    </linearGradient>
    <linearGradient id="darkIron" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="redEye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
  </defs>

  <!-- Tattered Scavenger Cloak -->
  <path d="M 20 26 L 15 50 L 23 47 L 28 52 L 35 48 L 43 51 L 47 46 L 44 26 Z" fill="#291509" stroke="#090d16" stroke-width="1.4"/>

  <!-- Hunched Torso in Stitched Leather Brigandine -->
  <path d="M 19 26 L 45 26 L 42 46 L 22 46 Z" fill="url(#gobLeather)" stroke="#090d16" stroke-width="1.6"/>
  <!-- Crossed Bandolier Straps & Iron Studs -->
  <line x1="21" y1="27" x2="41" y2="44" stroke="#92400e" stroke-width="2.2"/>
  <line x1="43" y1="27" x2="23" y2="44" stroke="#92400e" stroke-width="2.2"/>
  <circle cx="32" cy="35" r="2.2" fill="url(#darkIron)" stroke="#090d16" stroke-width="0.8"/>

  <!-- Belt with Skull Trophy Buckle -->
  <rect x="21" y="43" width="22" height="4" rx="1" fill="#1c0a00" stroke="#090d16" stroke-width="1"/>
  <path d="M 29 41 L 35 41 L 34 47 L 30 47 Z" fill="#e2e8f0" stroke="#090d16" stroke-width="1"/>
  <circle cx="31" cy="43.5" r="0.8" fill="#090d16"/>
  <circle cx="33" cy="43.5" r="0.8" fill="#090d16"/>

  <!-- Spiked Left Pauldron & Clawed Arm -->
  <path d="M 11 25 L 20 24 L 21 32 L 12 33 Z" fill="url(#darkIron)" stroke="#090d16" stroke-width="1.4"/>
  <polygon points="12,25 7,19 15,24" fill="#cbd5e1" stroke="#090d16" stroke-width="1"/>
  <path d="M 13 32 L 19 32 L 18 42 L 12 42 Z" fill="url(#gobSkin)" stroke="#090d16" stroke-width="1.3"/>
  <rect x="12" y="36" width="7" height="4" rx="1" fill="url(#gobLeather)" stroke="#090d16" stroke-width="1"/>

  <!-- Right Pauldron & Arm -->
  <path d="M 53 25 L 44 24 L 43 32 L 52 33 Z" fill="url(#gobLeather)" stroke="#090d16" stroke-width="1.4"/>
  <path d="M 45 32 L 51 32 L 52 42 L 46 42 Z" fill="url(#gobSkin)" stroke="#090d16" stroke-width="1.3"/>
  <rect x="45" y="36" width="7" height="4" rx="1" fill="url(#darkIron)" stroke="#090d16" stroke-width="1"/>

  <!-- Long Jagged Bat-Like Goblin Ears with Gold Ring -->
  <polygon points="18,16 3,9 7,21 18,23" fill="url(#gobSkin)" stroke="#090d16" stroke-width="1.5"/>
  <polygon points="46,16 61,9 57,21 46,23" fill="url(#gobSkin)" stroke="#090d16" stroke-width="1.5"/>
  <circle cx="9" cy="20" r="2.2" fill="none" stroke="#eab308" stroke-width="1.4"/>

  <!-- Feral Angular Goblin Head & Scarred Brow -->
  <path d="M 18 13 C 18 5 46 5 46 13 L 44 27 C 38 31 26 31 20 27 Z" fill="url(#gobSkin)" stroke="#090d16" stroke-width="1.6"/>
  <!-- Iron Cap / Bandana -->
  <path d="M 18 13 C 20 6 44 6 46 13 L 32 16 Z" fill="url(#darkIron)" stroke="#090d16" stroke-width="1.3"/>
  <circle cx="32" cy="11" r="1.2" fill="#cbd5e1"/>

  <!-- Glowing Crimson Slit Eyes & Angry Brow Ridge -->
  <polygon points="21,16 30,19 29,23 21,21" fill="url(#redEye)" stroke="#090d16" stroke-width="1"/>
  <polygon points="43,16 34,19 35,23 43,21" fill="url(#redEye)" stroke="#090d16" stroke-width="1"/>
  <line x1="25" y1="18" x2="25" y2="21" stroke="#ffffff" stroke-width="1"/>
  <line x1="39" y1="18" x2="39" y2="21" stroke="#ffffff" stroke-width="1"/>

  <!-- Hooked Nose & Snarling Fanged Maw -->
  <polygon points="32,19 29,24 35,24" fill="#1a2e05" stroke="#090d16" stroke-width="0.9"/>
  <path d="M 24 25 L 40 25 L 38 29 L 26 29 Z" fill="#090d16"/>
  <polygon points="25,28 27,24 29,28" fill="#fef9c3"/>
  <polygon points="35,28 37,24 39,28" fill="#fef9c3"/>
</svg>
