<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="spiderCarapace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="spiderLeg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- 8 Articulated Razor-Sharp Chitinous Ice Legs -->
  <g stroke="#082f49" stroke-width="1.3" fill="url(#spiderLeg)">
    <!-- Left 4 Legs -->
    <polygon points="22,28 9,14 2,22 10,19 20,31"/>
    <polygon points="20,32 5,25 1,35 8,30 19,35"/>
    <polygon points="20,36 6,38 2,49 9,42 21,39"/>
    <polygon points="23,40 12,48 9,58 16,51 25,42"/>
    <!-- Right 4 Legs -->
    <polygon points="42,28 55,14 62,22 54,19 44,31"/>
    <polygon points="44,32 59,25 63,35 56,30 45,35"/>
    <polygon points="44,36 58,38 62,49 55,42 43,39"/>
    <polygon points="41,40 52,48 55,58 48,51 39,42"/>
  </g>

  <!-- Crystalline Faceted Abdomen with Frost Glyph -->
  <path d="M 18 22 C 16 10 48 10 46 22 C 48 34 40 42 32 42 C 24 42 16 34 18 22 Z" fill="url(#spiderCarapace)" stroke="#082f49" stroke-width="1.6"/>
  <polygon points="32,14 38,23 32,32 26,23" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.1"/>
  <circle cx="32" cy="23" r="2.5" fill="#ffffff"/>

  <!-- Cephalothorax & Cluster of 6 Glowing Cyan Spider Eyes -->
  <ellipse cx="32" cy="39" rx="10" ry="7" fill="#0c4a6e" stroke="#082f49" stroke-width="1.5"/>
  <circle cx="28" cy="40" r="2" fill="#38bdf8"/><circle cx="28" cy="40" r="0.9" fill="#ffffff"/>
  <circle cx="36" cy="40" r="2" fill="#38bdf8"/><circle cx="36" cy="40" r="0.9" fill="#ffffff"/>
  <circle cx="25" cy="38" r="1.2" fill="#7dd3fc"/>
  <circle cx="39" cy="38" r="1.2" fill="#7dd3fc"/>
  <circle cx="30" cy="42" r="1" fill="#ffffff"/>
  <circle cx="34" cy="42" r="1" fill="#ffffff"/>

  <!-- Serrated Ice Mandibles / Fangs -->
  <polygon points="25,44 22,53 29,46" fill="#e0f2fe" stroke="#082f49" stroke-width="1.2"/>
  <polygon points="39,44 42,53 35,46" fill="#e0f2fe" stroke="#082f49" stroke-width="1.2"/>
</svg>
