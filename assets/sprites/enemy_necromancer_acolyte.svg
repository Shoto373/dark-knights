  <path d="M 53 23 L 42 21 L 41 29 L 51 30 Z" fill="#e2e8f0" stroke="#090d16" stroke-width="1.4"/>
  <circle cx="16" cy="25" r="1.8" fill="#c084fc"/>
  <circle cx="48" cy="25" r="1.8" fill="#c084fc"/>

