<svg xmlns="http://www.w3.org/2000/svg" width="36" height="48" viewBox="0 0 36 48">
  <defs>
    <linearGradient id="woodPost" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="sackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a16207" />
      <stop offset="50%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
  </defs>
  <!-- Wooden Post Support -->
  <rect x="16" y="34" width="4" height="13" fill="url(#woodPost)" stroke="#1c1917" stroke-width="0.8"/>
  <line x1="12" y1="46" x2="24" y2="46" stroke="#451a03" stroke-width="2" stroke-linecap="round"/>
  <!-- Arm crossbar sticking out -->
  <line x1="3" y1="18" x2="33" y2="18" stroke="#451a03" stroke-width="3" stroke-linecap="round"/>
  <circle cx="3" cy="18" r="1.5" fill="#facc15"/>
  <circle cx="33" cy="18" r="1.5" fill="#facc15"/>
  <!-- Torso (Burlap Sack) -->
  <path d="M 10 14 C 9 20, 8 28, 10 35 C 13 36, 23 36, 26 35 C 28 28, 27 20, 26 14 Z" fill="url(#sackGrad)" stroke="#451a03" stroke-width="1.2"/>
  <!-- Straw tufts leaking at waist -->
  <path d="M 11 35 L 9 39 M 13 35 L 12 40 M 23 35 L 24 40 M 25 35 L 27 38" stroke="#facc15" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Leather Straps on Torso -->
  <line x1="10" y1="21" x2="26" y2="21" stroke="#292524" stroke-width="1.5"/>
  <line x1="10" y1="29" x2="26" y2="29" stroke="#292524" stroke-width="1.5"/>
  <rect x="16.5" y="20" width="3" height="3" fill="#ca8a04" stroke="#713f12" stroke-width="0.6"/>
  <!-- Target Bullseye on Torso -->
  <circle cx="18" cy="25" r="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <circle cx="18" cy="25" r="3.5" fill="#ef4444"/>
  <circle cx="18" cy="25" r="1.5" fill="#fef2f2"/>
  <!-- Straw Neck Tufts -->
  <path d="M 14 14 L 12 11 M 18 14 L 18 10 M 22 14 L 24 11" stroke="#facc15" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Head (Stitched Sack) -->
  <ellipse cx="18" cy="8" rx="6.5" ry="7" fill="url(#sackGrad)" stroke="#451a03" stroke-width="1.2"/>
  <!-- Neck rope tie -->
  <line x1="13" y1="14" x2="23" y2="14" stroke="#451a03" stroke-width="2" stroke-linecap="round"/>
  <!-- Stitched Eyes & Mouth -->
  <line x1="14" y1="6" x2="16" y2="8" stroke="#1c1917" stroke-width="1.2"/>
  <line x1="16" y1="6" x2="14" y2="8" stroke="#1c1917" stroke-width="1.2"/>
  <line x1="20" y1="6" x2="22" y2="8" stroke="#1c1917" stroke-width="1.2"/>
  <line x1="22" y1="6" x2="20" y2="8" stroke="#1c1917" stroke-width="1.2"/>
  <path d="M 15 11 L 21 11" stroke="#1c1917" stroke-width="1.2"/>
  <line x1="16" y1="10" x2="16" y2="12" stroke="#1c1917" stroke-width="0.8"/>
  <line x1="18" y1="10" x2="18" y2="12" stroke="#1c1917" stroke-width="0.8"/>
  <line x1="20" y1="10" x2="20" y2="12" stroke="#1c1917" stroke-width="0.8"/>
</svg>