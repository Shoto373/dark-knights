<svg xmlns="http://www.w3.org/2000/svg" width="76" height="42" viewBox="0 0 76 42">
  <defs>
    <linearGradient id="sofaVelvet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="50%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="sofaCushion" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="65%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#580e0e"/>
    </linearGradient>
    <linearGradient id="sofaWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#522504"/>
      <stop offset="100%" stop-color="#240c01"/>
    </linearGradient>
  </defs>

  <!-- Floor Shadow -->
  <ellipse cx="38" cy="40" rx="36" ry="3" fill="#000000" opacity="0.55"/>

  <!-- Wooden Turned Feet -->
  <rect x="7" y="36" width="5" height="5" rx="1.5" fill="url(#sofaWood)" stroke="#090d16" stroke-width="0.8"/>
  <rect x="64" y="36" width="5" height="5" rx="1.5" fill="url(#sofaWood)" stroke="#090d16" stroke-width="0.8"/>
  <rect x="36" y="36" width="4" height="4" rx="1" fill="#1c0a00"/>

  <!-- Sofa Backrest (Tufted Velvet with buttons) -->
  <rect x="6" y="4" width="64" height="22" rx="6" fill="url(#sofaVelvet)" stroke="#2b0505" stroke-width="1.5"/>
  <line x1="8" y1="6" x2="68" y2="6" stroke="#ef4444" stroke-width="0.8" opacity="0.4"/>
  <!-- Button-tufted diamond indentations -->
  <circle cx="18" cy="12" r="1.5" fill="#450a0a"/>
  <circle cx="38" cy="12" r="1.5" fill="#450a0a"/>
  <circle cx="58" cy="12" r="1.5" fill="#450a0a"/>
  <circle cx="28" cy="17" r="1.5" fill="#450a0a"/>
  <circle cx="48" cy="17" r="1.5" fill="#450a0a"/>

  <!-- Left Rolled Armrest -->
  <rect x="3" y="16" width="11" height="20" rx="5" fill="url(#sofaVelvet)" stroke="#2b0505" stroke-width="1.3"/>
  <ellipse cx="8.5" cy="19" rx="3" ry="2" fill="#b91c1c" opacity="0.5"/>

  <!-- Right Rolled Armrest -->
  <rect x="62" y="16" width="11" height="20" rx="5" fill="url(#sofaVelvet)" stroke="#2b0505" stroke-width="1.3"/>
  <ellipse cx="67.5" cy="19" rx="3" ry="2" fill="#b91c1c" opacity="0.5"/>

  <!-- Dual Seat Cushions -->
  <!-- Left Cushion -->
  <rect x="13" y="21" width="24" height="15" rx="3" fill="url(#sofaCushion)" stroke="#3f0707" stroke-width="1.2"/>
  <line x1="15" y1="23" x2="35" y2="23" stroke="#f87171" stroke-width="0.8" opacity="0.5"/>
  <!-- Right Cushion -->
  <rect x="39" y="21" width="24" height="15" rx="3" fill="url(#sofaCushion)" stroke="#3f0707" stroke-width="1.2"/>
  <line x1="41" y1="23" x2="61" y2="23" stroke="#f87171" stroke-width="0.8" opacity="0.5"/>

  <!-- Decorative Golden Throw Pillow on Left Armrest -->
  <polygon points="12,18 20,24 16,32 8,26" fill="#ca8a04" stroke="#713f12" stroke-width="1"/>
  <polygon points="13,19 19,24 15,30 9,25" fill="#eab308"/>
  <circle cx="14" cy="24" r="1" fill="#fef08a"/>
</svg>

