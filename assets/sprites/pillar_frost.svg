<svg xmlns="http://www.w3.org/2000/svg" width="48" height="64" viewBox="0 0 48 64">
  <!-- Frost World Glacial Spire Pillar -->
  <defs>
    <linearGradient id="frostPillarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <ellipse cx="24" cy="60" rx="18" ry="4" fill="#000000" opacity="0.6"/>

  <!-- Frozen Permafrost Base -->
  <polygon points="5,58 43,58 40,50 8,50" fill="#034b73" stroke="#082f49" stroke-width="1.2"/>
  <line x1="8" y1="51" x2="40" y2="51" stroke="#bae6fd" stroke-width="1.2"/>

  <!-- Faceted Crystalline Obelisk Shaft -->
  <polygon points="10,50 38,50 34,10 14,10" fill="url(#frostPillarGrad)" stroke="#0c4a6e" stroke-width="1.3"/>
  <!-- Central Crystal Facet Line -->
  <polygon points="20,50 28,50 26,10 22,10" fill="#e0f2fe" opacity="0.65"/>
  <line x1="24" y1="10" x2="24" y2="50" stroke="#ffffff" stroke-width="1.2"/>

  <!-- Frost Shards protruding from shaft -->
  <polygon points="12,28 6,24 13,20" fill="#bae6fd" stroke="#0284c7" stroke-width="0.8"/>
  <polygon points="36,36 42,32 35,28" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>

  <!-- Top Pointed Ice Spire -->
  <polygon points="14,10 34,10 24,1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <line x1="24" y1="1" x2="24" y2="10" stroke="#ffffff" stroke-width="1.4"/>
</svg>

