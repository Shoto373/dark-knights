<svg xmlns="http://www.w3.org/2000/svg" width="48" height="64" viewBox="0 0 48 64">
  <!-- Goblin Dungeon Prison Pillar -->
  <defs>
    <linearGradient id="gobPillarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e1713"/>
      <stop offset="35%" stop-color="#182c24"/>
      <stop offset="70%" stop-color="#243f34"/>
      <stop offset="100%" stop-color="#0e1713"/>
    </linearGradient>
  </defs>

  <!-- Shadow Base -->
  <ellipse cx="24" cy="60" rx="18" ry="4" fill="#000000" opacity="0.6"/>

  <!-- Plinth Base -->
  <rect x="6" y="52" width="36" height="8" rx="2" fill="#0a120e" stroke="#040907" stroke-width="1.2"/>
  <rect x="9" y="48" width="30" height="5" fill="#13231e" stroke="#040907" stroke-width="1"/>

  <!-- Column Shaft -->
  <rect x="12" y="14" width="24" height="34" fill="url(#gobPillarGrad)" stroke="#040907" stroke-width="1.2"/>
  <line x1="18" y1="14" x2="18" y2="48" stroke="#08100c" stroke-width="1"/>
  <line x1="24" y1="14" x2="24" y2="48" stroke="#34594a" stroke-width="1"/>
  <line x1="30" y1="14" x2="30" y2="48" stroke="#08100c" stroke-width="1"/>

  <!-- Rusty Iron Ring and Wrapping Chains -->
  <rect x="10" y="28" width="28" height="6" rx="2" fill="#78350f" stroke="#451a03" stroke-width="1"/>
  <circle cx="16" cy="31" r="1.2" fill="#d97706"/>
  <circle cx="32" cy="31" r="1.2" fill="#d97706"/>
  <!-- Dangling Chain Links -->
  <path d="M 24 34 L 21 40 L 25 46 L 22 52" stroke="#92400e" stroke-width="2.2" fill="none"/>
  <path d="M 24 34 L 21 40 L 25 46 L 22 52" stroke="#d97706" stroke-width="1.0" fill="none"/>

  <!-- Capital / Top Slab -->
  <polygon points="6,14 42,14 44,6 4,6" fill="#182c24" stroke="#040907" stroke-width="1.2"/>
  <rect x="4" y="4" width="40" height="4" rx="1" fill="#0a120e" stroke="#040907" stroke-width="1"/>
  <!-- Moss Patch -->
  <circle cx="12" cy="10" r="2.5" fill="#22c55e" opacity="0.75"/>
</svg>

