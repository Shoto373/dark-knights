<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="dkSteel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="45%" stop-color="#64748b"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="dkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
  </defs>

  <!-- Royal Crimson Plume & Guard Cape -->
  <path d="M 28 2 C 36 0 44 5 42 12 L 32 10 Z" fill="#dc2626" stroke="#090d16" stroke-width="1.2"/>
  <path d="M 19 24 L 16 52 L 48 52 L 45 24 Z" fill="#450a0a" stroke="#090d16" stroke-width="1.4"/>

  <!-- Heavy Gothic Fluted Plate Cuirass -->
  <path d="M 17 22 L 47 22 L 43 46 L 21 46 Z" fill="url(#dkSteel)" stroke="#090d16" stroke-width="1.7"/>
  <line x1="32" y1="22" x2="32" y2="45" stroke="url(#dkGold)" stroke-width="1.8"/>
  <polygon points="19,44 29,44 27,51 19,49" fill="url(#dkSteel)" stroke="#090d16" stroke-width="1.2"/>
  <polygon points="45,44 35,44 37,51 45,49" fill="url(#dkSteel)" stroke="#090d16" stroke-width="1.2"/>

  <!-- Spiked Gothic Pauldrons -->
  <path d="M 8 20 L 19 19 L 20 29 L 9 30 Z" fill="url(#dkSteel)" stroke="#090d16" stroke-width="1.5"/>
  <polygon points="56,20 45,19 44,29 55,30" fill="url(#dkSteel)" stroke="#090d16" stroke-width="1.5"/>

  <!-- Horned Greathelm with Glowing Blue Visor -->
  <path d="M 18 12 C 13 6 9 3 12 10 L 19 16 Z" fill="url(#dkGold)" stroke="#090d16" stroke-width="1.2"/>
  <path d="M 46 12 C 51 6 55 3 52 10 L 45 16 Z" fill="url(#dkGold)" stroke="#090d16" stroke-width="1.2"/>
  <path d="M 20 9 C 20 4 44 4 44 9 L 45 23 L 19 23 Z" fill="url(#dkSteel)" stroke="#090d16" stroke-width="1.6"/>
  <rect x="22" y="14" width="20" height="3" rx="1" fill="#090d16"/>
  <rect x="24" y="14.8" width="16" height="1.5" fill="#38bdf8"/>

  <!-- Impenetrable Tower Shield (Front Bulwark) -->
  <path d="M 3 18 L 23 18 L 23 44 L 13 54 L 3 44 Z" fill="url(#dkSteel)" stroke="url(#dkGold)" stroke-width="2"/>
  <line x1="13" y1="21" x2="13" y2="50" stroke="url(#dkGold)" stroke-width="2"/>
  <line x1="6" y1="33" x2="20" y2="33" stroke="url(#dkGold)" stroke-width="2"/>
  <circle cx="13" cy="33" r="2.8" fill="#38bdf8" stroke="#090d16" stroke-width="1"/>
</svg>
