<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="65%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="rustSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="soulEye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Tattered Crimson Legionnaire Tabard Cape -->
  <path d="M 20 25 L 16 51 L 24 47 L 32 52 L 40 47 L 48 51 L 44 25 Z" fill="#7f1d1d" stroke="#090d16" stroke-width="1.4"/>

  <!-- Anatomical Spine & Sculpted Ribcage -->
  <rect x="30" y="24" width="4" height="22" rx="1" fill="url(#boneGrad)" stroke="#090d16" stroke-width="1.2"/>
  <path d="M 21 27 Q 32 30 43 27 L 42 30 Q 32 33 22 30 Z" fill="url(#boneGrad)" stroke="#090d16" stroke-width="1.1"/>
  <path d="M 22 32 Q 32 35 42 32 L 41 35 Q 32 38 23 35 Z" fill="url(#boneGrad)" stroke="#090d16" stroke-width="1.1"/>
  <path d="M 24 37 Q 32 40 40 37 L 39 40 Q 32 42 25 40 Z" fill="url(#boneGrad)" stroke="#090d16" stroke-width="1.1"/>
  <!-- Skeletal Pelvis & War Belt -->
  <path d="M 22 42 L 42 42 L 39 47 L 25 47 Z" fill="url(#boneGrad)" stroke="#090d16" stroke-width="1.3"/>
  <rect x="22" y="41" width="20" height="3.5" rx="1" fill="#3b1909" stroke="#090d16" stroke-width="1"/>

  <!-- Armored Steel Pauldrons & Skeletal Arms -->
  <path d="M 11 23 L 21 22 L 22 29 L 12 30 Z" fill="url(#rustSteel)" stroke="#090d16" stroke-width="1.4"/>
  <rect x="14" y="29" width="4" height="12" rx="1.5" fill="url(#boneGrad)" stroke="#090d16" stroke-width="1.2"/>
  <!-- Buckler Shield on Left Forearm -->
  <circle cx="14" cy="38" r="7" fill="url(#rustSteel)" stroke="#090d16" stroke-width="1.5"/>
  <circle cx="14" cy="38" r="2.5" fill="#eab308" stroke="#090d16" stroke-width="1"/>

  <path d="M 53 23 L 43 22 L 42 29 L 52 30 Z" fill="url(#rustSteel)" stroke="#090d16" stroke-width="1.4"/>
  <rect x="46" y="29" width="4" height="12" rx="1.5" fill="url(#boneGrad)" stroke="#090d16" stroke-width="1.2"/>

  <!-- Detailed Menacing Skull with Cracked Brow -->
  <path d="M 20 11 C 20 3 44 3 44 11 C 45 17 42 21 40 23 L 38 27 L 26 27 L 24 23 C 22 21 19 17 20 11 Z" fill="url(#boneGrad)" stroke="#090d16" stroke-width="1.6"/>
  <path d="M 25 6 L 28 11 L 26 13" stroke="#090d16" stroke-width="1.1" fill="none"/>

  <!-- Abyssal Socket Cavities with Blazing Cyan Soul-Fire -->
  <polygon points="22,14 30,15 29,20 22,19" fill="#090d16"/>
  <polygon points="42,14 34,15 35,20 42,19" fill="#090d16"/>
  <circle cx="26" cy="17" r="3" fill="url(#soulEye)"/>
  <circle cx="38" cy="17" r="3" fill="url(#soulEye)"/>
  <circle cx="26" cy="17" r="1.1" fill="#ffffff"/>
  <circle cx="38" cy="17" r="1.1" fill="#ffffff"/>

  <!-- Nasal Cavity & Clenched Skull Teeth -->
  <polygon points="32,18 30,22 34,22" fill="#090d16"/>
  <line x1="28" y1="24" x2="28" y2="27" stroke="#090d16" stroke-width="1.2"/>
  <line x1="32" y1="24" x2="32" y2="27" stroke="#090d16" stroke-width="1.2"/>
  <line x1="36" y1="24" x2="36" y2="27" stroke="#090d16" stroke-width="1.2"/>
</svg>
