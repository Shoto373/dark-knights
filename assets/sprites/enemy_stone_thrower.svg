<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="throwStone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78716c"/>
      <stop offset="60%" stop-color="#44403c"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="boulderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8a29e"/>
      <stop offset="55%" stop-color="#57534e"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
  </defs>

  <!-- Broad Mountain Troll Torso -->
  <path d="M 12 21 L 52 21 L 47 49 L 17 49 Z" fill="url(#throwStone)" stroke="#090d16" stroke-width="1.8"/>
  <!-- Heavy Leather Boulder-Harness Across Chest -->
  <path d="M 15 22 L 46 46 M 49 22 L 18 46" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
  <circle cx="32" cy="34" r="4" fill="#d97706" stroke="#090d16" stroke-width="1.2"/>

  <!-- Belt & Pelts -->
  <rect x="17" y="43" width="30" height="6" rx="1.5" fill="#291103" stroke="#090d16" stroke-width="1.4"/>

  <!-- Mossy Shoulder Crags -->
  <polygon points="5,22 13,15 21,20 18,31 6,30" fill="url(#boulderGrad)" stroke="#090d16" stroke-width="1.5"/>
  <polygon points="59,22 51,15 43,20 46,31 58,30" fill="url(#boulderGrad)" stroke="#090d16" stroke-width="1.5"/>

  <!-- Muscular Arms Positioned to Hurl -->
  <rect x="5" y="29" width="10" height="14" rx="3" fill="url(#throwStone)" stroke="#090d16" stroke-width="1.5"/>
  <rect x="49" y="29" width="10" height="14" rx="3" fill="url(#throwStone)" stroke="#090d16" stroke-width="1.5"/>

  <!-- Craggy Troll Head with Glowing Yellow Eyes -->
  <path d="M 18 10 C 18 4 46 4 46 10 L 45 26 L 19 26 Z" fill="url(#boulderGrad)" stroke="#090d16" stroke-width="1.7"/>
  <!-- Moss Patch on Scalp -->
  <path d="M 22 6 Q 32 2 42 6 L 38 11 L 26 11 Z" fill="#3f6212" stroke="#090d16" stroke-width="1"/>

  <polygon points="21,15 29,17 28,20 21,19" fill="#facc15" stroke="#090d16" stroke-width="1"/>
  <polygon points="43,15 35,17 36,20 43,19" fill="#facc15" stroke="#090d16" stroke-width="1"/>
  <circle cx="25" cy="17.5" r="1" fill="#ffffff"/>
  <circle cx="39" cy="17.5" r="1" fill="#ffffff"/>

  <!-- Snarling Tusks -->
  <path d="M 20 22 L 44 22 L 42 27 L 22 27 Z" fill="#292524" stroke="#090d16" stroke-width="1.3"/>
  <polygon points="22,23 25,17 28,23" fill="#fef9c3" stroke="#090d16" stroke-width="1"/>
  <polygon points="42,23 39,17 36,23" fill="#fef9c3" stroke="#090d16" stroke-width="1"/>
</svg>
