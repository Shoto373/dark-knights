<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="trollStone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="55%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="trollRock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="amberEye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </radialGradient>
  </defs>

  <!-- Colossal Craggy Stone Torso -->
  <path d="M 10 20 L 54 20 L 48 50 L 16 50 Z" fill="url(#trollStone)" stroke="#090d16" stroke-width="1.8"/>
  <!-- Chiseled Pectoral Rock Plates & Cracks -->
  <polygon points="15,24 31,24 29,36 16,35" fill="url(#trollRock)" stroke="#090d16" stroke-width="1.2"/>
  <polygon points="49,24 33,24 35,36 48,35" fill="url(#trollRock)" stroke="#090d16" stroke-width="1.2"/>
  <path d="M 22 36 L 26 42 L 24 46 M 42 36 L 38 43" stroke="#090d16" stroke-width="1.3" fill="none"/>

  <!-- Fur & Chain Loincloth Belt -->
  <rect x="16" y="42" width="32" height="7" rx="2" fill="#451a03" stroke="#090d16" stroke-width="1.5"/>
  <circle cx="24" cy="45.5" r="2.2" fill="#94a3b8" stroke="#090d16" stroke-width="1"/>
  <circle cx="32" cy="45.5" r="3" fill="#eab308" stroke="#090d16" stroke-width="1"/>
  <circle cx="40" cy="45.5" r="2.2" fill="#94a3b8" stroke="#090d16" stroke-width="1"/>

  <!-- Jagged Granite Shoulder Boulders -->
  <polygon points="3,22 10,13 20,18 17,31 5,31" fill="url(#trollRock)" stroke="#090d16" stroke-width="1.6"/>
  <polygon points="61,22 54,13 44,18 47,31 59,31" fill="url(#trollRock)" stroke="#090d16" stroke-width="1.6"/>

  <!-- Massive Forearms with Iron Shackles -->
  <rect x="4" y="30" width="11" height="15" rx="3" fill="url(#trollStone)" stroke="#090d16" stroke-width="1.5"/>
  <rect x="3" y="38" width="12" height="5" rx="1" fill="#1e293b" stroke="#090d16" stroke-width="1.2"/>
  <rect x="49" y="30" width="11" height="15" rx="3" fill="url(#trollStone)" stroke="#090d16" stroke-width="1.5"/>
  <rect x="49" y="38" width="12" height="5" rx="1" fill="#1e293b" stroke="#090d16" stroke-width="1.2"/>

  <!-- Heavy Brow Mountain Troll Head -->
  <path d="M 16 10 C 16 3 48 3 48 10 L 47 27 L 17 27 Z" fill="url(#trollRock)" stroke="#090d16" stroke-width="1.8"/>
  <!-- Craggy Forehead Ridge -->
  <polygon points="15,13 32,17 49,13 46,9 32,12 18,9" fill="#334155" stroke="#090d16" stroke-width="1.2"/>

  <!-- Blazing Molten Amber Eyes -->
  <circle cx="24" cy="17" r="3.5" fill="url(#amberEye)" stroke="#090d16" stroke-width="1"/>
  <circle cx="40" cy="17" r="3.5" fill="url(#amberEye)" stroke="#090d16" stroke-width="1"/>

  <!-- Brutish Underbite Jaw & Stone Tusks -->
  <path d="M 18 22 L 46 22 L 44 29 L 20 29 Z" fill="#334155" stroke="#090d16" stroke-width="1.5"/>
  <polygon points="20,23 23,15 26,23" fill="#e2e8f0" stroke="#090d16" stroke-width="1.1"/>
  <polygon points="44,23 41,15 38,23" fill="#e2e8f0" stroke="#090d16" stroke-width="1.1"/>
</svg>
