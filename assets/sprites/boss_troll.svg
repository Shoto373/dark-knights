<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="tkGranite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="tkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="tkMoss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="55%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
  </defs>

  <!-- Pillar-Like Stone Legs -->
  <rect x="24" y="68" width="16" height="18" rx="4" fill="url(#tkGranite)" stroke="#090d16" stroke-width="2.2"/>
  <rect x="56" y="68" width="16" height="18" rx="4" fill="url(#tkGranite)" stroke="#090d16" stroke-width="2.2"/>

  <!-- Colossal Mountain-Behemoth Torso & Runic Chest Plate -->
  <path d="M 14 28 L 82 28 L 74 72 L 22 72 Z" fill="url(#tkGranite)" stroke="#090d16" stroke-width="2.5"/>
  <!-- Glowing Emerald Regeneration Runes Carved in Stone Chest -->
  <polygon points="48,38 56,50 48,62 40,50" fill="none" stroke="#4ade80" stroke-width="2.5"/>
  <circle cx="48" cy="50" r="4" fill="#86efac"/>
  <!-- Heavy Gold & Obsidian King Belt -->
  <rect x="20" y="62" width="56" height="9" rx="2" fill="#1e293b" stroke="url(#tkGold)" stroke-width="2"/>
  <polygon points="48,60 55,66.5 48,73 41,66.5" fill="url(#tkGold)" stroke="#090d16" stroke-width="1.5"/>

  <!-- Towering Craggy Mountain-Peak Shoulders with Moss -->
  <polygon points="2,30 14,12 30,24 25,44 5,42" fill="url(#tkGranite)" stroke="#090d16" stroke-width="2.2"/>
  <path d="M 8 22 L 16 14 L 24 22 Z" fill="url(#tkMoss)"/>
  <polygon points="94,30 82,12 66,24 71,44 91,42" fill="url(#tkGranite)" stroke="#090d16" stroke-width="2.2"/>
  <path d="M 88 22 L 80 14 L 72 22 Z" fill="url(#tkMoss)"/>

  <!-- Titan Forearms & Earthshaker Runic Warhammer -->
  <rect x="4" y="42" width="16" height="22" rx="4" fill="url(#tkGranite)" stroke="#090d16" stroke-width="2"/>
  <rect x="76" y="42" width="16" height="22" rx="4" fill="url(#tkGranite)" stroke="#090d16" stroke-width="2"/>
  <!-- Colossal Stone-Runic Warhammer Held on Right -->
  <line x1="84" y1="22" x2="80" y2="86" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
  <polygon points="68,10 95,14 93,34 66,30" fill="url(#tkGranite)" stroke="#090d16" stroke-width="2.2"/>
  <circle cx="81" cy="22" r="3.5" fill="#4ade80"/>

  <!-- Monarch Head, Braided Moss Beard & Jagged Golden Crown -->
  <path d="M 24 16 C 24 6 72 6 72 16 L 70 40 L 26 40 Z" fill="url(#tkGranite)" stroke="#090d16" stroke-width="2.2"/>
  <polygon points="25,17 31,2 40,13 48,0 56,13 65,2 71,17" fill="url(#tkGold)" stroke="#090d16" stroke-width="2"/>
  <!-- Braided Emerald Moss Royal Beard -->
  <path d="M 28 34 L 68 34 L 62 52 L 48 58 L 34 52 Z" fill="url(#tkMoss)" stroke="#090d16" stroke-width="1.8"/>
  <!-- Blazing Volcanic Amber Eyes & Giant Tusks -->
  <circle cx="37" cy="25" r="4.5" fill="#f97316" stroke="#090d16" stroke-width="1.3"/>
  <circle cx="59" cy="25" r="4.5" fill="#f97316" stroke="#090d16" stroke-width="1.3"/>
  <circle cx="37" cy="25" r="1.8" fill="#fef08a"/>
  <circle cx="59" cy="25" r="1.8" fill="#fef08a"/>
  <polygon points="29,35 33,24 38,35" fill="#fef9c3" stroke="#090d16" stroke-width="1.4"/>
  <polygon points="67,35 63,24 58,35" fill="#fef9c3" stroke="#090d16" stroke-width="1.4"/>
</svg>
