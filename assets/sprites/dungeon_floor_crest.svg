<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="crestGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Subtle floor glow background -->
  <circle cx="64" cy="64" r="62" fill="url(#crestGlow)"/>
  <!-- Outer Runic Ring -->
  <circle cx="64" cy="64" r="58" fill="none" stroke="#334155" stroke-width="2"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Cardinal Glyph Marks -->
  <line x1="64" y1="6" x2="64" y2="16" stroke="#38bdf8" stroke-width="2"/>
  <line x1="64" y1="112" x2="64" y2="122" stroke="#38bdf8" stroke-width="2"/>
  <line x1="6" y1="64" x2="16" y2="64" stroke="#38bdf8" stroke-width="2"/>
  <line x1="112" y1="64" x2="122" y2="64" stroke="#38bdf8" stroke-width="2"/>
  <!-- 8-Pointed Star / Compass Motif -->
  <polygon points="64,18 70,54 110,64 70,74 64,110 58,74 18,64 58,54" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="64,30 68,56 100,64 68,72 64,100 60,72 28,64 60,56" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.7"/>
  <!-- Diagonal subtle rays -->
  <line x1="28" y1="28" x2="100" y2="100" stroke="#334155" stroke-width="1"/>
  <line x1="100" y1="28" x2="28" y2="100" stroke="#334155" stroke-width="1"/>
  <!-- Inner Ring & Core Rune -->
  <circle cx="64" cy="64" r="22" fill="#090d16" stroke="#475569" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="18" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3"/>
  <polygon points="64,52 74,64 64,76 54,64" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="3" fill="#facc15"/>
</svg>