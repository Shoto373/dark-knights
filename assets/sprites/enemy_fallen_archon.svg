  <path d="M 42 22 L 62 8 L 60 22 L 54 24 L 61 32 L 45 31 Z" fill="url(#darkWing)" stroke="url(#archonGold)" stroke-width="1.2"/>
  <path d="M 22 31 L 6 38 L 11 47 L 23 41 Z" fill="#1e1b4b" stroke="#7e22ce" stroke-width="1.1"/>
  <path d="M 42 31 L 58 38 L 53 47 L 41 41 Z" fill="#1e1b4b" stroke="#7e22ce" stroke-width="1.1"/>

  <!-- Ornate Celestial-Abyssal Armor & Robe -->
  <path d="M 19 23 L 45 23 L 43 52 L 32 56 L 21 52 Z" fill="#1e1b4b" stroke="url(#archonGold)" stroke-width="1.6"/>
  <polygon points="22,24 42,24 38,40 26,40" fill="url(#archonGold)" stroke="#090d16" stroke-width="1.3"/>
  <!-- Astral Core Gem -->
  <polygon points="32,27 36,33 32,39 28,33" fill="#e9d5ff" stroke="#7e22ce" stroke-width="1"/>

  <!-- Sculpted Golden Seraph Mask -->
  <path d="M 22 10 C 22 4 42 4 42 10 L 40 23 L 32 26 L 24 23 Z" fill="url(#archonGold)" stroke="#090d16" stroke-width="1.5"/>
  <!-- Blazing Astral Eyes -->
