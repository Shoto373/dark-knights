<svg xmlns="http://www.w3.org/2000/svg" width="44" height="42" viewBox="0 0 44 42">
  <defs>
    <linearGradient id="armchairVelvet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="50%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="armchairCushion" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="65%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#580e0e"/>
    </linearGradient>
  </defs>

  <!-- Floor Shadow -->
  <ellipse cx="22" cy="40" rx="19" ry="3" fill="#000000" opacity="0.55"/>

  <!-- Wooden Feet -->
  <rect x="5" y="36" width="4" height="5" rx="1" fill="#451a03" stroke="#1c0700" stroke-width="0.8"/>
  <rect x="35" y="36" width="4" height="5" rx="1" fill="#451a03" stroke="#1c0700" stroke-width="0.8"/>

  <!-- Backrest -->
  <rect x="5" y="4" width="34" height="22" rx="5" fill="url(#armchairVelvet)" stroke="#2b0505" stroke-width="1.4"/>
  <circle cx="16" cy="13" r="1.3" fill="#450a0a"/>
  <circle cx="28" cy="13" r="1.3" fill="#450a0a"/>

  <!-- Armrests -->
  <rect x="2" y="16" width="9" height="20" rx="4" fill="url(#armchairVelvet)" stroke="#2b0505" stroke-width="1.2"/>
  <rect x="33" y="16" width="9" height="20" rx="4" fill="url(#armchairVelvet)" stroke="#2b0505" stroke-width="1.2"/>

  <!-- Plush Seat Cushion -->
  <rect x="10" y="21" width="24" height="15" rx="3" fill="url(#armchairCushion)" stroke="#3f0707" stroke-width="1.2"/>
  <line x1="12" y1="23" x2="32" y2="23" stroke="#f87171" stroke-width="0.8" opacity="0.5"/>
</svg>

