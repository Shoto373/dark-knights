<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Troll Gorge Ancient Monolith Crest -->
  <defs>
    <radialGradient id="trollCrestAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#78350f" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1c1109" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="48" cy="48" r="44" fill="url(#trollCrestAura)"/>
  
  <!-- Outer Rough Carved Stone Ring -->
  <circle cx="48" cy="48" r="40" fill="none" stroke="#452a16" stroke-width="3"/>
  <circle cx="48" cy="48" r="32" fill="none" stroke="#92400e" stroke-width="1.5"/>

  <!-- Ancient Standing Stone Markers on Ring -->
  <rect x="45" y="4" width="6" height="10" rx="1" fill="#714e32" stroke="#241409" stroke-width="0.8"/>
  <rect x="45" y="82" width="6" height="10" rx="1" fill="#714e32" stroke="#241409" stroke-width="0.8"/>
  <rect x="4" y="45" width="10" height="6" rx="1" fill="#714e32" stroke="#241409" stroke-width="0.8"/>
  <rect x="82" y="45" width="10" height="6" rx="1" fill="#714e32" stroke="#241409" stroke-width="0.8"/>

  <!-- Giant Troll Claw Slash Marks in Center -->
  <path d="M 28 26 L 40 70" stroke="#b45309" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 38 22 L 50 74" stroke="#d97706" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M 48 24 L 60 70" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 58 30 L 68 64" stroke="#b45309" stroke-width="3.0" stroke-linecap="round"/>

  <!-- Core Petroglyph Swirl -->
  <circle cx="48" cy="48" r="16" fill="none" stroke="#fde68a" stroke-width="1.8" stroke-dasharray="4,6" opacity="0.85"/>
  <circle cx="48" cy="48" r="5" fill="#f59e0b" stroke="#78350f" stroke-width="1.2"/>
</svg>

