<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bruteSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4d7c0f"/>
      <stop offset="60%" stop-color="#365314"/>
      <stop offset="100%" stop-color="#142605"/>
    </linearGradient>
    <linearGradient id="bruteIron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Hulking Muscular Torso -->
  <path d="M 12 22 L 52 22 L 46 48 L 18 48 Z" fill="url(#bruteSkin)" stroke="#090d16" stroke-width="1.8"/>
  <!-- Red War Paint & Battle Scars on Chest -->
  <path d="M 20 28 L 28 36 M 44 28 L 36 36" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Heavy Chained Iron Belly-Plate & War Belt -->
  <path d="M 17 37 L 47 37 L 45 48 L 19 48 Z" fill="url(#bruteIron)" stroke="#090d16" stroke-width="1.6"/>
  <circle cx="32" cy="42" r="4.5" fill="#eab308" stroke="#090d16" stroke-width="1.2"/>
  <polygon points="32,39 34,42 32,45 30,42" fill="#dc2626"/>

  <!-- Colossal Spiked Iron Pauldrons -->
  <path d="M 4 20 L 18 18 L 19 30 L 6 31 Z" fill="url(#bruteIron)" stroke="#090d16" stroke-width="1.6"/>
  <polygon points="7,20 2,11 12,18" fill="#cbd5e1" stroke="#090d16" stroke-width="1.2"/>
  <polygon points="13,18 11,10 17,18" fill="#cbd5e1" stroke="#090d16" stroke-width="1.2"/>

  <path d="M 60 20 L 46 18 L 45 30 L 58 31 Z" fill="url(#bruteIron)" stroke="#090d16" stroke-width="1.6"/>
  <polygon points="57,20 62,11 52,18" fill="#cbd5e1" stroke="#090d16" stroke-width="1.2"/>
  <polygon points="51,18 53,10 47,18" fill="#cbd5e1" stroke="#090d16" stroke-width="1.2"/>

  <!-- Massive Biceps & Spiked Iron Gauntlets -->
  <rect x="6" y="30" width="10" height="14" rx="3" fill="url(#bruteSkin)" stroke="#090d16" stroke-width="1.5"/>
  <rect x="6" y="37" width="10" height="7" rx="1.5" fill="url(#bruteIron)" stroke="#090d16" stroke-width="1.3"/>
  <rect x="48" y="30" width="10" height="14" rx="3" fill="url(#bruteSkin)" stroke="#090d16" stroke-width="1.5"/>
  <rect x="48" y="37" width="10" height="7" rx="1.5" fill="url(#bruteIron)" stroke="#090d16" stroke-width="1.3"/>

  <!-- Notched Goblin Ears -->
  <polygon points="17,14 4,10 8,20 17,20" fill="url(#bruteSkin)" stroke="#090d16" stroke-width="1.4"/>
  <polygon points="47,14 60,10 56,20 47,20" fill="url(#bruteSkin)" stroke="#090d16" stroke-width="1.4"/>

  <!-- Brutish Head with Riveted Iron Jaw-Guard -->
  <path d="M 17 11 C 17 4 47 4 47 11 L 46 25 L 18 25 Z" fill="url(#bruteSkin)" stroke="#090d16" stroke-width="1.7"/>
  <!-- Horned Iron Helm -->
  <path d="M 17 12 C 19 4 45 4 47 12 L 32 15 Z" fill="url(#bruteIron)" stroke="#090d16" stroke-width="1.5"/>
  <polygon points="32,2 35,8 29,8" fill="#cbd5e1" stroke="#090d16" stroke-width="1"/>

  <!-- Blazing Bloodshot Rage Eyes -->
  <polygon points="20,14 29,17 28,20 20,18" fill="#ef4444" stroke="#090d16" stroke-width="1"/>
  <polygon points="44,14 35,17 36,20 44,18" fill="#ef4444" stroke="#090d16" stroke-width="1"/>
  <circle cx="25" cy="17" r="1" fill="#fef08a"/>
  <circle cx="39" cy="17" r="1" fill="#fef08a"/>

  <!-- Iron Jaw Trap & Huge Tusks -->
  <path d="M 18 21 L 46 21 L 43 28 L 21 28 Z" fill="url(#bruteIron)" stroke="#090d16" stroke-width="1.5"/>
  <polygon points="21,22 24,15 27,22" fill="#fef9c3" stroke="#090d16" stroke-width="1"/>
  <polygon points="43,22 40,15 37,22" fill="#fef9c3" stroke="#090d16" stroke-width="1"/>
  <circle cx="25" cy="25" r="1" fill="#94a3b8"/>
  <circle cx="32" cy="25" r="1" fill="#94a3b8"/>
  <circle cx="39" cy="25" r="1" fill="#94a3b8"/>
</svg>
