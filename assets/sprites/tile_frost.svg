<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="iceGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="iceGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Deep Blue Glacial Abyss Base -->
  <rect width="64" height="64" fill="#032030"/>

  <!-- Sub-surface Glacial Light Glow -->
  <circle cx="20" cy="20" r="16" fill="#38bdf8" opacity="0.15"/>
  <circle cx="48" cy="48" r="18" fill="#0284c7" opacity="0.2"/>

  <!-- Ice Slab 1 (Top Left) -->
  <polygon points="2,2 30,2 28,30 2,28" fill="url(#iceGrad1)" stroke="#0c4a6e" stroke-width="1.2"/>
  <line x1="3" y1="3" x2="29" y2="3" stroke="#7dd3fc" stroke-width="1.2"/>
  <line x1="3" y1="3" x2="3" y2="27" stroke="#7dd3fc" stroke-width="1.2"/>
  <!-- Crystalline Ice Cracks -->
  <path d="M 8 6 L 14 14 L 11 22 L 20 26" stroke="#e0f2fe" stroke-width="0.9" fill="none" opacity="0.85"/>
  <line x1="14" y1="14" x2="22" y2="12" stroke="#bae6fd" stroke-width="0.7"/>

  <!-- Ice Slab 2 (Top Right) -->
  <polygon points="34,2 62,3 61,28 33,30" fill="url(#iceGrad1)" stroke="#0c4a6e" stroke-width="1.2"/>
  <line x1="35" y1="3" x2="61" y2="4" stroke="#7dd3fc" stroke-width="1.2"/>
  <!-- Frost Snowflake Mandala in Center -->
  <line x1="48" y1="8" x2="48" y2="22" stroke="#f0f9ff" stroke-width="0.9" opacity="0.8"/>
  <line x1="41" y1="15" x2="55" y2="15" stroke="#f0f9ff" stroke-width="0.9" opacity="0.8"/>
  <line x1="43" y1="10" x2="53" y2="20" stroke="#bae6fd" stroke-width="0.7" opacity="0.7"/>
  <line x1="43" y1="20" x2="53" y2="10" stroke="#bae6fd" stroke-width="0.7" opacity="0.7"/>
  <circle cx="48" cy="15" r="1.5" fill="#ffffff"/>

  <!-- Ice Slab 3 (Bottom Left) -->
  <polygon points="2,32 29,34 27,62 2,61" fill="url(#iceGrad1)" stroke="#0c4a6e" stroke-width="1.2"/>
  <line x1="3" y1="33" x2="28" y2="35" stroke="#7dd3fc" stroke-width="1.2"/>
  <!-- Frozen Air Bubbles -->
  <circle cx="10" cy="42" r="1.8" fill="#bae6fd" opacity="0.6"/>
  <circle cx="18" cy="48" r="1.2" fill="#e0f2fe" opacity="0.8"/>
  <circle cx="14" cy="54" r="1.5" fill="#7dd3fc" opacity="0.7"/>

  <!-- Ice Slab 4 (Bottom Right - Radiant Glacier) -->
  <polygon points="32,33 62,31 61,61 31,62" fill="url(#iceGrad1)" stroke="#0c4a6e" stroke-width="1.2"/>
  <line x1="33" y1="34" x2="61" y2="32" stroke="#7dd3fc" stroke-width="1.2"/>
  <path d="M 40 40 L 46 48 L 56 46 L 52 58" stroke="#e0f2fe" stroke-width="1.0" fill="none" opacity="0.9"/>
  <circle cx="46" cy="48" r="2" fill="#ffffff" opacity="0.9"/>
</svg>
