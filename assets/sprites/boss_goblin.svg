<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="chiefSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#65a30d"/>
      <stop offset="60%" stop-color="#365314"/>
      <stop offset="100%" stop-color="#142605"/>
    </linearGradient>
    <linearGradient id="chiefSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="chiefGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
  </defs>

  <!-- Tattered Crimson Warlord Cape -->
  <path d="M 20 34 L 10 82 L 26 76 L 38 84 L 48 77 L 58 84 L 70 76 L 86 82 L 76 34 Z" fill="#7f1d1d" stroke="#090d16" stroke-width="2.2"/>

  <!-- Armored Warlord Legs & Spiked Greaves -->
  <rect x="28" y="68" width="14" height="18" rx="3" fill="url(#chiefSteel)" stroke="#090d16" stroke-width="2"/>
  <rect x="54" y="68" width="14" height="18" rx="3" fill="url(#chiefSteel)" stroke="#090d16" stroke-width="2"/>

  <!-- Massive Black-Iron Warlord Cuirass & Skull Belt -->
  <path d="M 20 34 L 76 34 L 68 70 L 28 70 Z" fill="url(#chiefSteel)" stroke="#090d16" stroke-width="2.4"/>
  <polygon points="28,38 68,38 62,58 34,58" fill="#1e293b" stroke="url(#chiefGold)" stroke-width="1.5"/>
  <!-- Trophy Skull on Chest -->
  <circle cx="48" cy="48" r="7" fill="#e2e8f0" stroke="#090d16" stroke-width="1.6"/>
  <circle cx="45.5" cy="47" r="1.8" fill="#ef4444"/>
  <circle cx="50.5" cy="47" r="1.8" fill="#ef4444"/>
  <rect x="24" y="63" width="48" height="7" rx="2" fill="#451a03" stroke="#090d16" stroke-width="1.8"/>
  <rect x="42" y="61" width="12" height="10" rx="2" fill="url(#chiefGold)" stroke="#090d16" stroke-width="1.5"/>

  <!-- Colossal Spiked Pauldrons -->
  <polygon points="4,32 24,26 26,44 8,46" fill="url(#chiefSteel)" stroke="#090d16" stroke-width="2.2"/>
  <polygon points="8,30 1,16 16,27" fill="#fef08a" stroke="#090d16" stroke-width="1.5"/>
  <polygon points="92,32 72,26 70,44 88,46" fill="url(#chiefSteel)" stroke="#090d16" stroke-width="2.2"/>
  <polygon points="88,30 95,16 80,27" fill="#fef08a" stroke="#090d16" stroke-width="1.5"/>

  <!-- Dual War-Cleavers Held in Armored Gauntlets -->
  <path d="M 8 44 L 20 44 L 18 62 L 6 62 Z" fill="url(#chiefSkin)" stroke="#090d16" stroke-width="1.8"/>
  <path d="M 4 38 L 16 18 L 24 24 L 14 54 Z" fill="#cbd5e1" stroke="#090d16" stroke-width="1.8"/>
  <path d="M 88 44 L 76 44 L 78 62 L 90 62 Z" fill="url(#chiefSkin)" stroke="#090d16" stroke-width="1.8"/>
  <path d="M 92 38 L 80 18 L 72 24 L 82 54 Z" fill="#cbd5e1" stroke="#090d16" stroke-width="1.8"/>

  <!-- Long Battle-Notched Goblin Ears with Gold Hoops -->
  <polygon points="25,22 4,14 10,29 25,31" fill="url(#chiefSkin)" stroke="#090d16" stroke-width="2"/>
  <polygon points="71,22 92,14 86,29 71,31" fill="url(#chiefSkin)" stroke="#090d16" stroke-width="2"/>
  <circle cx="12" cy="28" r="3.5" fill="none" stroke="url(#chiefGold)" stroke-width="2"/>
  <circle cx="84" cy="28" r="3.5" fill="none" stroke="url(#chiefGold)" stroke-width="2"/>

  <!-- Warlord Head, Tusks & Jagged Gold-and-Bone Crown -->
  <path d="M 24 18 C 24 8 72 8 72 18 L 68 38 L 28 38 Z" fill="url(#chiefSkin)" stroke="#090d16" stroke-width="2.2"/>
  <polygon points="24,18 28,4 38,14 48,2 58,14 68,4 72,18" fill="url(#chiefGold)" stroke="#090d16" stroke-width="2"/>
  <circle cx="48" cy="12" r="2.8" fill="#ef4444"/>

  <!-- Blazing Crimson Warlord Eyes -->
  <polygon points="29,22 43,25 41,30 29,28" fill="#ef4444" stroke="#090d16" stroke-width="1.3"/>
  <polygon points="67,22 53,25 55,30 67,28" fill="#ef4444" stroke="#090d16" stroke-width="1.3"/>
  <circle cx="36" cy="26" r="1.5" fill="#fef08a"/>
  <circle cx="60" cy="26" r="1.5" fill="#fef08a"/>

  <!-- Iron Jaw-Guard & Massive War Tusks -->
  <path d="M 26 32 L 70 32 L 66 41 L 30 41 Z" fill="url(#chiefSteel)" stroke="#090d16" stroke-width="1.8"/>
  <polygon points="30,33 34,23 39,33" fill="#fef9c3" stroke="#090d16" stroke-width="1.4"/>
  <polygon points="66,33 62,23 57,33" fill="#fef9c3" stroke="#090d16" stroke-width="1.4"/>
</svg>
