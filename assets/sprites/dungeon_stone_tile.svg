<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Base Dark Stone Bed -->
  <rect width="64" height="64" fill="#0d1117"/>
  <!-- Mortar Grooves -->
  <!-- Stone 1 (Top Left) -->
  <rect x="1" y="1" width="30" height="30" rx="2" fill="#1e2530" stroke="#0a0d13" stroke-width="1.2"/>
  <line x1="2" y1="2" x2="30" y2="2" stroke="#2d3748" stroke-width="1"/>
  <line x1="2" y1="2" x2="2" y2="30" stroke="#2d3748" stroke-width="1"/>
  <line x1="2" y1="30" x2="30" y2="30" stroke="#0f131a" stroke-width="1"/>
  <line x1="30" y1="2" x2="30" y2="30" stroke="#0f131a" stroke-width="1"/>
  <!-- Crack on Stone 1 -->
  <path d="M 6 8 L 12 14 L 10 20 L 16 24" fill="none" stroke="#0f131a" stroke-width="0.8"/>

  <!-- Stone 2 (Top Right) -->
  <rect x="33" y="1" width="30" height="18" rx="2" fill="#18202a" stroke="#0a0d13" stroke-width="1.2"/>
  <line x1="34" y1="2" x2="62" y2="2" stroke="#283344" stroke-width="1"/>
  <line x1="34" y1="2" x2="34" y2="18" stroke="#283344" stroke-width="1"/>
  <circle cx="48" cy="9" r="1" fill="#0f131a"/>

  <!-- Stone 3 (Middle Right) -->
  <rect x="33" y="21" width="30" height="22" rx="2" fill="#202936" stroke="#0a0d13" stroke-width="1.2"/>
  <line x1="34" y1="22" x2="62" y2="22" stroke="#2d394b" stroke-width="1"/>
  <path d="M 52 23 L 48 30 L 53 36" fill="none" stroke="#0f131a" stroke-width="0.8"/>

  <!-- Stone 4 (Bottom Left) -->
  <rect x="1" y="33" width="18" height="30" rx="2" fill="#161c24" stroke="#0a0d13" stroke-width="1.2"/>
  <line x1="2" y1="34" x2="18" y2="34" stroke="#252e3c" stroke-width="1"/>

  <!-- Stone 5 (Bottom Middle-Right) -->
  <rect x="21" y="45" width="42" height="18" rx="2" fill="#1a222c" stroke="#0a0d13" stroke-width="1.2"/>
  <line x1="22" y1="46" x2="62" y2="46" stroke="#2a3545" stroke-width="1"/>
  <!-- Moss / lichen fleck -->
  <circle cx="28" cy="50" r="1.5" fill="#14532d" opacity="0.6"/>
  <circle cx="40" cy="54" r="1.2" fill="#14532d" opacity="0.6"/>
</svg>