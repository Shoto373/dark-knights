<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="shamRobe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="60%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#1e0536"/>
    </linearGradient>
    <linearGradient id="boneMask" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="65%" stop-color="#d6d3d1"/>
      <stop offset="100%" stop-color="#78716c"/>
    </linearGradient>
    <radialGradient id="voodooGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Feathered Ritual Mantle & Tattered Robe -->
  <path d="M 16 24 L 12 52 L 22 49 L 28 54 L 32 50 L 36 54 L 42 49 L 52 52 L 48 24 Z" fill="url(#shamRobe)" stroke="#090d16" stroke-width="1.6"/>
  <!-- Glowing Emerald Runic Trim -->
  <path d="M 27 28 L 25 51 M 37 28 L 39 51" stroke="#22c55e" stroke-width="1.5"/>

  <!-- Tribal Bone Necklace & Shrunken Skull Totem -->
  <path d="M 21 26 Q 32 35 43 26" fill="none" stroke="#fef08a" stroke-width="2"/>
  <circle cx="25" cy="30" r="2" fill="#e7e5e4" stroke="#090d16" stroke-width="0.8"/>
  <circle cx="32" cy="32" r="2.8" fill="#4ade80" stroke="#090d16" stroke-width="1"/>
  <circle cx="39" cy="30" r="2" fill="#e7e5e4" stroke="#090d16" stroke-width="0.8"/>

  <!-- Shaman Sleeves & Green Hands -->
  <path d="M 11 26 L 19 25 L 18 40 L 10 39 Z" fill="url(#shamRobe)" stroke="#090d16" stroke-width="1.3"/>
  <circle cx="14" cy="41" r="3" fill="#4d7c0f" stroke="#090d16" stroke-width="1"/>
  <path d="M 45 25 L 53 26 L 54 39 L 46 40 Z" fill="url(#shamRobe)" stroke="#090d16" stroke-width="1.3"/>
  <circle cx="50" cy="41" r="3" fill="#4d7c0f" stroke="#090d16" stroke-width="1"/>

  <!-- Goblin Ears with Feather Danglers -->
  <polygon points="18,17 4,13 8,22 18,23" fill="#4d7c0f" stroke="#090d16" stroke-width="1.4"/>
  <polygon points="46,17 60,13 56,22 46,23" fill="#4d7c0f" stroke="#090d16" stroke-width="1.4"/>

  <!-- Tribal Feather Crown Behind Mask -->
  <polygon points="24,10 18,1 28,8" fill="#dc2626" stroke="#090d16" stroke-width="1"/>
  <polygon points="32,8 32,0 36,8" fill="#eab308" stroke="#090d16" stroke-width="1"/>
  <polygon points="40,10 46,1 36,8" fill="#dc2626" stroke="#090d16" stroke-width="1"/>

  <!-- Horned Demon-Skull Ritual Mask -->
  <path d="M 17 12 C 13 5 7 4 9 11 C 11 15 15 16 18 16 Z" fill="#57534e" stroke="#090d16" stroke-width="1.3"/>
  <path d="M 47 12 C 51 5 57 4 55 11 C 53 15 49 16 46 16 Z" fill="#57534e" stroke="#090d16" stroke-width="1.3"/>
  <path d="M 18 10 C 18 4 46 4 46 10 L 44 26 L 38 30 L 32 27 L 26 30 L 20 26 Z" fill="url(#boneMask)" stroke="#090d16" stroke-width="1.6"/>
  <!-- Red War-Paint Markings on Skull Mask -->
  <path d="M 32 6 L 32 15 M 23 11 L 28 15 M 41 11 L 36 15" stroke="#dc2626" stroke-width="1.8"/>

  <!-- Blazing Necro-Emerald Eye Sockets -->
  <circle cx="26" cy="18" r="4" fill="#090d16"/>
  <circle cx="38" cy="18" r="4" fill="#090d16"/>
  <circle cx="26" cy="18" r="3.5" fill="url(#voodooGlow)"/>
  <circle cx="38" cy="18" r="3.5" fill="url(#voodooGlow)"/>
  <circle cx="26" cy="18" r="1.3" fill="#ffffff"/>
  <circle cx="38" cy="18" r="1.3" fill="#ffffff"/>

  <!-- Jagged Skull Teeth -->
  <line x1="25" y1="24" x2="25" y2="28" stroke="#090d16" stroke-width="1.4"/>
  <line x1="29" y1="24" x2="29" y2="29" stroke="#090d16" stroke-width="1.4"/>
  <line x1="35" y1="24" x2="35" y2="29" stroke="#090d16" stroke-width="1.4"/>
  <line x1="39" y1="24" x2="39" y2="28" stroke="#090d16" stroke-width="1.4"/>
</svg>
