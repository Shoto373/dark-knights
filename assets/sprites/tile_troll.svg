<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Canyon Sandstone & Earth Bed -->
  <rect width="64" height="64" fill="#1c1109"/>

  <!-- Dirt and Sandy Mortar Veins -->
  <path d="M 0 30 Q 32 36 64 28 L 64 36 Q 32 44 0 38 Z" fill="#29180b"/>
  <path d="M 28 0 Q 32 32 36 64 L 42 64 Q 38 32 34 0 Z" fill="#29180b"/>

  <!-- Boulder 1 (Top Left - Jagged Mountain Slate) -->
  <polygon points="3,3 27,2 29,27 4,28" fill="#38291c" stroke="#120a05" stroke-width="1.3"/>
  <line x1="4" y1="4" x2="26" y2="3" stroke="#57412e" stroke-width="1.1"/>
  <line x1="4" y1="4" x2="5" y2="27" stroke="#57412e" stroke-width="1.1"/>
  <!-- Rock fractures -->
  <path d="M 10 8 L 18 16 L 14 24" stroke="#180f08" stroke-width="0.9" fill="none"/>
  <circle cx="22" cy="10" r="1.2" fill="#785c43"/>

  <!-- Boulder 2 (Top Right - Chiseled Sandstone) -->
  <polygon points="35,3 61,4 60,25 36,26" fill="#332418" stroke="#120a05" stroke-width="1.3"/>
  <line x1="36" y1="4" x2="60" y2="5" stroke="#4d3725" stroke-width="1.1"/>
  <!-- Root winding through crack -->
  <path d="M 45 2 Q 50 12 44 24" stroke="#854d0e" stroke-width="1.2" fill="none"/>
  <path d="M 47 10 Q 56 16 52 23" stroke="#a16207" stroke-width="0.8" fill="none"/>

  <!-- Boulder 3 (Bottom Left - Coarse Crag) -->
  <polygon points="3,34 26,35 25,61 4,60" fill="#2e1f14" stroke="#120a05" stroke-width="1.3"/>
  <line x1="4" y1="35" x2="25" y2="36" stroke="#473121" stroke-width="1.1"/>
  <line x1="4" y1="35" x2="5" y2="59" stroke="#473121" stroke-width="1.1"/>
  <!-- Pebbles and gravel -->
  <circle cx="8" cy="48" r="1.8" fill="#5c422c" stroke="#1a110a" stroke-width="0.6"/>
  <circle cx="14" cy="52" r="1.3" fill="#6e5036" stroke="#1a110a" stroke-width="0.5"/>
  <circle cx="18" cy="45" r="1.5" fill="#5c422c" stroke="#1a110a" stroke-width="0.6"/>

  <!-- Boulder 4 (Bottom Right - Flat River Stone) -->
  <polygon points="34,33 61,31 60,60 33,61" fill="#3b2b1e" stroke="#120a05" stroke-width="1.3"/>
  <line x1="35" y1="34" x2="60" y2="32" stroke="#5e4632" stroke-width="1.1"/>
  <!-- Deep fissure -->
  <path d="M 42 38 L 48 45 L 43 55" stroke="#140b06" stroke-width="1.2" fill="none"/>
  <circle cx="53" cy="50" r="1.5" fill="#854d0e"/>
</svg>

