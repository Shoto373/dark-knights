  </defs>
  <!-- Flask Body (Heart / Bulbous Shape) -->
  <path d="M 20 10 C 23 10, 34 16, 34 26 C 34 33, 27 38, 20 38 C 13 38, 6 33, 6 26 C 6 16, 17 10, 20 10 Z" fill="url(#liquidGrad)" stroke="#1c1917" stroke-width="1.5"/>
