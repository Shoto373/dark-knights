  <path d="M 34 16 C 38 18, 42 17, 44 15 C 41 14, 38 15, 36 14 Z" fill="#eab308" stroke="#713f12" stroke-width="0.8"/>
  <path d="M 35 5 C 39 4, 45 7, 46 12 C 45 17, 39 20, 35 19 C 38 16, 38 8, 35 5 Z" fill="none" stroke="#ca8a04" stroke-width="1.2"/>
  <!-- Crystal Orb -->
  <circle cx="41" cy="12" r="5.5" fill="url(#orbGlow)"/>
  <!-- Arcane ring around orb -->
  <ellipse cx="41" cy="12" rx="7.5" ry="3" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- Magic sparkle core -->
  <circle cx="40" cy="11" r="1.5" fill="#ffffff"/>
  <line x1="41" y1="5" x2="41" y2="7" stroke="#67e8f9" stroke-width="1"/>
  <line x1="41" y1="17" x2="41" y2="19" stroke="#67e8f9" stroke-width="1"/>
</svg>