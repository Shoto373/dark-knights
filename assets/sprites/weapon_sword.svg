  <!-- Handle / Grip -->
  <rect x="2" y="10.5" width="8" height="3" rx="1.5" fill="#451a03" stroke="#1c1917" stroke-width="1"/>
  <line x1="4" y1="10.5" x2="4" y2="13.5" stroke="#78350f" stroke-width="0.8"/>
