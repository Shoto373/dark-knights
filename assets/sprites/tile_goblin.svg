<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Goblin Dungeon Damp Stone Bed -->
  <rect width="64" height="64" fill="#080f0d"/>
  
  <!-- Slime & Water Seepage Base -->
  <path d="M 0 0 L 28 0 L 24 16 L 8 22 Z" fill="#064e3b" opacity="0.45"/>
  <path d="M 40 42 Q 52 38 64 46 L 64 64 L 32 64 Z" fill="#047857" opacity="0.35"/>

  <!-- Flagstone 1 (Top Left) -->
  <rect x="2" y="2" width="28" height="28" rx="2" fill="#13231e" stroke="#04120e" stroke-width="1.2"/>
  <line x1="3" y1="3" x2="29" y2="3" stroke="#224238" stroke-width="1"/>
  <line x1="3" y1="3" x2="3" y2="29" stroke="#224238" stroke-width="1"/>
  <!-- Moss growth in corner -->
  <circle cx="6" cy="7" r="2.5" fill="#166534" opacity="0.8"/>
  <circle cx="10" cy="5" r="1.8" fill="#4ade80" opacity="0.6"/>
  <!-- Chiseled pickaxe chip -->
  <path d="M 18 10 L 22 14 L 17 18" stroke="#04120e" stroke-width="0.9" fill="none"/>

  <!-- Flagstone 2 (Top Right with Iron Drain Grate) -->
  <rect x="32" y="2" width="30" height="26" rx="2" fill="#17221d" stroke="#04120e" stroke-width="1.2"/>
  <line x1="33" y1="3" x2="61" y2="3" stroke="#24382e" stroke-width="1"/>
  <!-- Rusty Drain Grate in middle -->
  <rect x="40" y="8" width="14" height="14" rx="1.5" fill="#060b09" stroke="#78350f" stroke-width="1"/>
  <line x1="43" y1="9" x2="43" y2="21" stroke="#92400e" stroke-width="1"/>
  <line x1="47" y1="9" x2="47" y2="21" stroke="#92400e" stroke-width="1"/>
  <line x1="51" y1="9" x2="51" y2="21" stroke="#92400e" stroke-width="1"/>
  <line x1="40" y1="15" x2="54" y2="15" stroke="#78350f" stroke-width="1"/>

  <!-- Flagstone 3 (Bottom Left - Cracked stone) -->
  <rect x="2" y="32" width="24" height="30" rx="2" fill="#141f1a" stroke="#04120e" stroke-width="1.2"/>
  <line x1="3" y1="33" x2="25" y2="33" stroke="#20332a" stroke-width="1"/>
  <path d="M 8 36 L 14 44 L 11 52 L 18 58" stroke="#04120e" stroke-width="1" fill="none"/>
  <circle cx="20" cy="40" r="1.5" fill="#15803d" opacity="0.7"/>

  <!-- Flagstone 4 (Bottom Right - Slime puddle) -->
  <rect x="28" y="30" width="34" height="32" rx="2" fill="#162720" stroke="#04120e" stroke-width="1.2"/>
  <line x1="29" y1="31" x2="61" y2="31" stroke="#264436" stroke-width="1"/>
  <!-- Toxic green droplet pool -->
  <ellipse cx="45" cy="46" rx="9" ry="5" fill="#052e16" stroke="#16a34a" stroke-width="0.8"/>
  <ellipse cx="44" cy="45" rx="5" ry="2.5" fill="#22c55e" opacity="0.6"/>
  <circle cx="48" cy="44" r="1.2" fill="#86efac" opacity="0.85"/>
</svg>
