      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="55%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#090414"/>
    </linearGradient>
    <linearGradient id="necroGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <radialGradient id="necroOrb" cx="50%" cy="50%" r="50%">
