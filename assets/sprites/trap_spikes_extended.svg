<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <defs>
    <linearGradient id="ironPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="spikeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="45%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <!-- Floor Plate -->
  <rect x="2" y="2" width="32" height="32" rx="3" fill="url(#ironPlate)" stroke="#090d16" stroke-width="1.5"/>
  <circle cx="5" cy="5" r="1.2" fill="#64748b"/>
  <circle cx="31" cy="5" r="1.2" fill="#64748b"/>
  <circle cx="5" cy="31" r="1.2" fill="#64748b"/>
  <circle cx="31" cy="31" r="1.2" fill="#64748b"/>
  <rect x="6" y="6" width="24" height="24" rx="2" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
  <!-- 4 Cruel Protruding Steel Spikes -->
  <!-- Spike Top-Left -->
  <polygon points="12,4 8,15 16,15" fill="url(#spikeGrad)" stroke="#0f172a" stroke-width="1"/>
  <line x1="12" y1="4" x2="12" y2="15" stroke="#ffffff" stroke-width="0.8"/>
  <polygon points="12,4 10,9 13,8" fill="#dc2626" opacity="0.9"/> <!-- Blood tip -->

  <!-- Spike Top-Right -->
  <polygon points="24,4 20,15 28,15" fill="url(#spikeGrad)" stroke="#0f172a" stroke-width="1"/>
  <line x1="24" y1="4" x2="24" y2="15" stroke="#ffffff" stroke-width="0.8"/>
  <polygon points="24,4 23,8 26,9" fill="#dc2626" opacity="0.9"/>

  <!-- Spike Bottom-Left -->
  <polygon points="12,17 8,28 16,28" fill="url(#spikeGrad)" stroke="#0f172a" stroke-width="1"/>
  <line x1="12" y1="17" x2="12" y2="28" stroke="#ffffff" stroke-width="0.8"/>
  <polygon points="12,17 11,21 14,22" fill="#dc2626" opacity="0.9"/>

  <!-- Spike Bottom-Right -->
  <polygon points="24,17 20,28 28,28" fill="url(#spikeGrad)" stroke="#0f172a" stroke-width="1"/>
  <line x1="24" y1="17" x2="24" y2="28" stroke="#ffffff" stroke-width="0.8"/>
  <polygon points="24,17 22,22 25,21" fill="#dc2626" opacity="0.9"/>
  <!-- Blood splatters on plate -->
  <circle cx="18" cy="18" r="1.5" fill="#991b1b"/>
  <circle cx="15" cy="19" r="0.9" fill="#991b1b"/>
  <circle cx="21" cy="16" r="1.1" fill="#991b1b"/>
</svg>