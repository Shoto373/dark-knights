<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Fire World Molten Dragon Sigil Crest -->
  <defs>
    <radialGradient id="fireCrestAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#dc2626" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#450a0a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </radialGradient>
  </defs>

  <circle cx="48" cy="48" r="44" fill="url(#fireCrestAura)"/>
  
  <!-- Outer Ring with Solar Flare Rays -->
  <circle cx="48" cy="48" r="38" fill="none" stroke="#ea580c" stroke-width="2.5"/>
  <circle cx="48" cy="48" r="30" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="5,4"/>

  <!-- 12 Flame Petals -->
  <polygon points="48,6 52,14 44,14" fill="#fde047"/>
  <polygon points="48,90 52,82 44,82" fill="#fde047"/>
  <polygon points="6,48 14,52 14,44" fill="#fde047"/>
  <polygon points="90,48 82,52 82,44" fill="#fde047"/>

  <!-- Dragon Eye Center Shape -->
  <path d="M 20 48 Q 48 24 76 48 Q 48 72 20 48 Z" fill="#450a0a" stroke="#f97316" stroke-width="2.5"/>
  <path d="M 26 48 Q 48 30 70 48 Q 48 66 26 48 Z" fill="url(#eyeGrad)"/>

  <!-- Slit Dragon Pupil -->
  <polygon points="48,32 51,48 48,64 45,48" fill="#180402" stroke="#7f1d1d" stroke-width="1"/>
  <ellipse cx="48" cy="48" rx="1.5" ry="5" fill="#000000"/>
  <circle cx="47" cy="45" r="1.2" fill="#ffffff"/>
</svg>
