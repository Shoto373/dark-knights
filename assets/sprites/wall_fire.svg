<svg xmlns="http://www.w3.org/2000/svg" width="64" height="32" viewBox="0 0 64 32">
  <defs>
    <linearGradient id="wallLava" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
  </defs>

  <!-- Glowing Magma Mortar Bed -->
  <rect width="64" height="32" fill="#200503"/>

  <!-- Lava weeping along mortar seam -->
  <line x1="0" y1="16" x2="64" y2="16" stroke="url(#wallLava)" stroke-width="2"/>
  <line x1="32" y1="0" x2="32" y2="16" stroke="url(#wallLava)" stroke-width="1.8"/>
  <line x1="16" y1="16" x2="16" y2="32" stroke="url(#wallLava)" stroke-width="1.8"/>
  <line x1="48" y1="16" x2="48" y2="32" stroke="url(#wallLava)" stroke-width="1.8"/>

  <!-- Row 1: Scorched Basalt Blocks -->
  <rect x="1" y="1" width="30" height="14" rx="1.5" fill="#170c0b" stroke="#450a0a" stroke-width="1"/>
  <line x1="2" y1="2" x2="30" y2="2" stroke="#2e1917" stroke-width="0.8"/>
  <path d="M 12 3 L 16 9 L 10 14" stroke="#ea580c" stroke-width="0.8" fill="none"/>

  <rect x="33" y="1" width="30" height="14" rx="1.5" fill="#1a0e0d" stroke="#450a0a" stroke-width="1"/>
  <line x1="34" y1="2" x2="62" y2="2" stroke="#331c1a" stroke-width="0.8"/>
  <circle cx="48" cy="8" r="1.5" fill="#f97316"/>
  <circle cx="48" cy="8" r="0.7" fill="#fef08a"/>

  <!-- Row 2: Lower Scorched Blocks -->
  <rect x="1" y="17" width="14" height="14" rx="1.5" fill="#150a09" stroke="#450a0a" stroke-width="1"/>
  <line x1="2" y1="18" x2="14" y2="18" stroke="#2b1513" stroke-width="0.8"/>

  <rect x="17" y="17" width="30" height="14" rx="1.5" fill="#1b0f0e" stroke="#450a0a" stroke-width="1"/>
  <line x1="18" y1="18" x2="46" y2="18" stroke="#361e1c" stroke-width="0.8"/>
  <!-- Lava drip -->
  <path d="M 32 17 L 31 22 L 33 26" stroke="#f97316" stroke-width="1" fill="none"/>

  <rect x="49" y="17" width="14" height="14" rx="1.5" fill="#180d0c" stroke="#450a0a" stroke-width="1"/>
  <line x1="50" y1="18" x2="62" y2="18" stroke="#301a18" stroke-width="0.8"/>
</svg>

