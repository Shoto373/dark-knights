<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Purgatory Astral Singularity Crest -->
  <defs>
    <radialGradient id="purgCrestAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#090314" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eventHorizon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="60%" stop-color="#2e1065"/>
      <stop offset="85%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </radialGradient>
  </defs>

  <circle cx="48" cy="48" r="44" fill="url(#purgCrestAura)"/>
  
  <!-- Outer Cosmic Runes Ring -->
  <circle cx="48" cy="48" r="40" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <circle cx="48" cy="48" r="32" fill="none" stroke="#c084fc" stroke-width="1.2" stroke-dasharray="4,6"/>
  <circle cx="48" cy="48" r="26" fill="none" stroke="#f472b6" stroke-width="0.8"/>

  <!-- Arcane Astral Triangles / Star of Void -->
  <polygon points="48,16 68,54 28,54" fill="none" stroke="#a855f7" stroke-width="1.4"/>
  <polygon points="48,80 28,42 68,42" fill="none" stroke="#a855f7" stroke-width="1.4"/>

  <!-- Black Hole / Event Horizon Singularity -->
  <circle cx="48" cy="48" r="16" fill="url(#eventHorizon)" stroke="#e9d5ff" stroke-width="1.5"/>
  <circle cx="48" cy="48" r="8" fill="#05010a"/>
  
  <!-- Pulsing Ethereal White Dot -->
  <circle cx="48" cy="48" r="2.5" fill="#ffffff"/>
</svg>
