<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="skArmor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#475569"/>
      <stop offset="65%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="skCape" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="60%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#180404"/>
    </linearGradient>
    <linearGradient id="skGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
  </defs>

  <!-- Majestic Flowing Royal Crimson Mantle -->
  <path d="M 18 30 L 8 86 L 26 78 L 38 88 L 48 80 L 58 88 L 70 78 L 88 86 L 78 30 Z" fill="url(#skCape)" stroke="#090d16" stroke-width="2.2"/>

  <!-- Armored Sabatons & Greaves -->
  <rect x="29" y="66" width="13" height="20" rx="2" fill="url(#skArmor)" stroke="#090d16" stroke-width="2"/>
  <rect x="54" y="66" width="13" height="20" rx="2" fill="url(#skArmor)" stroke="#090d16" stroke-width="2"/>

  <!-- Gothic Black-Steel Sovereign Cuirass & Rib-Armor -->
  <path d="M 22 32 L 74 32 L 66 68 L 30 68 Z" fill="url(#skArmor)" stroke="#090d16" stroke-width="2.4"/>
  <!-- Glowing Soul-Core & Gold Heraldry on Breastplate -->
  <polygon points="48,36 58,48 48,60 38,48" fill="#0f172a" stroke="url(#skGold)" stroke-width="1.8"/>
  <polygon points="48,40 53,48 48,56 43,48" fill="#38bdf8"/>
  <line x1="28" y1="42" x2="38" y2="45" stroke="url(#skGold)" stroke-width="2"/>
  <line x1="68" y1="42" x2="58" y2="45" stroke="url(#skGold)" stroke-width="2"/>

  <!-- Winged Spiked Death-Lord Pauldrons -->
  <polygon points="3,28 22,22 25,40 7,42" fill="url(#skArmor)" stroke="url(#skGold)" stroke-width="1.8"/>
  <polygon points="6,26 1,12 16,22" fill="url(#skGold)" stroke="#090d16" stroke-width="1.3"/>
  <polygon points="93,28 74,22 71,40 89,42" fill="url(#skArmor)" stroke="url(#skGold)" stroke-width="1.8"/>
  <polygon points="90,26 95,12 80,22" fill="url(#skGold)" stroke="#090d16" stroke-width="1.3"/>

  <!-- Cursed Runeblade Held Upright on Right -->
  <polygon points="82,4 87,14 85,68 79,68 77,14" fill="#bae6fd" stroke="#0284c7" stroke-width="1.8"/>
  <line x1="82" y1="10" x2="82" y2="64" stroke="#ffffff" stroke-width="1.6"/>
  <path d="M 71 66 L 93 66 L 88 71 L 76 71 Z" fill="url(#skGold)" stroke="#090d16" stroke-width="1.5"/>

  <!-- Ancient Sovereign Skull & Towering Golden Crown -->
  <path d="M 28 16 C 28 6 68 6 68 16 L 64 36 L 32 36 Z" fill="#f1f5f9" stroke="#090d16" stroke-width="2.2"/>
  <polygon points="26,17 30,2 40,12 48,0 56,12 66,2 70,17" fill="url(#skGold)" stroke="#090d16" stroke-width="2"/>
  <circle cx="48" cy="10" r="2.8" fill="#38bdf8"/>

  <!-- Blazing Abyssal Soul-Fire Eye Sockets -->
  <polygon points="32,21 44,23 43,29 32,27" fill="#090d16"/>
  <polygon points="64,21 52,23 53,29 64,27" fill="#090d16"/>
  <circle cx="38" cy="25" r="3" fill="#38bdf8"/><circle cx="38" cy="25" r="1.3" fill="#ffffff"/>
  <circle cx="58" cy="25" r="3" fill="#38bdf8"/><circle cx="58" cy="25" r="1.3" fill="#ffffff"/>
  <line x1="40" y1="32" x2="40" y2="36" stroke="#090d16" stroke-width="1.6"/>
  <line x1="48" y1="32" x2="48" y2="36" stroke="#090d16" stroke-width="1.6"/>
  <line x1="56" y1="32" x2="56" y2="36" stroke="#090d16" stroke-width="1.6"/>
</svg>
