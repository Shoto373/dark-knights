<svg xmlns="http://www.w3.org/2000/svg" width="48" height="64" viewBox="0 0 48 64">
  <!-- Troll Gorge Monolith Pillar -->
  <defs>
    <linearGradient id="trollPillarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#24150b"/>
      <stop offset="40%" stop-color="#3d2919"/>
      <stop offset="75%" stop-color="#543c29"/>
      <stop offset="100%" stop-color="#1f1108"/>
    </linearGradient>
  </defs>

  <ellipse cx="24" cy="60" rx="18" ry="4" fill="#000000" opacity="0.6"/>

  <!-- Rough Boulder Base -->
  <polygon points="4,58 44,57 41,50 7,49" fill="#2d1c10" stroke="#120803" stroke-width="1.2"/>

  <!-- Tapering Monolith Body -->
  <polygon points="8,50 40,49 36,12 12,12" fill="url(#trollPillarGrad)" stroke="#120803" stroke-width="1.3"/>
  <!-- Rugged chisel ridges -->
  <line x1="20" y1="12" x2="16" y2="50" stroke="#170c06" stroke-width="1.2"/>
  <line x1="28" y1="12" x2="32" y2="50" stroke="#715239" stroke-width="1"/>

  <!-- Ancient Primitive Petroglyph / Spiral Carving -->
  <path d="M 24 24 Q 28 20 28 26 Q 28 32 20 32 Q 16 32 16 24 Q 16 16 26 16 Q 34 16 34 26 Q 34 38 22 38" fill="none" stroke="#a16207" stroke-width="1.4" opacity="0.85"/>
  <circle cx="24" cy="26" r="1.5" fill="#facc15" opacity="0.9"/>

  <!-- Rough Jagged Top Slab -->
  <polygon points="9,12 39,12 34,4 14,4" fill="#4a3321" stroke="#120803" stroke-width="1.2"/>
  <polygon points="12,4 36,4 30,1 18,1" fill="#26160c" stroke="#120803" stroke-width="1"/>
</svg>

